<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英単語50問 | Web演習</title><style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#eef3fa;font:16px/1.65 system-ui,-apple-system,"Yu Gothic",sans-serif}main{max-width:920px;margin:30px auto;padding:18px}a{color:#b4d7ff}.panel{background:#1c2c44;border:1px solid #506987;border-radius:16px;padding:clamp(18px,4vw,30px);margin:18px 0}h1{font-size:clamp(25px,5vw,36px);margin:12px 0}h2{font-size:21px;margin:0 0 12px}.muted{color:#c0cee0}.categories{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:12px}.category{display:block;width:100%;text-align:left;background:#263b58;color:#fff;border:1px solid #7192b7;border-radius:12px;padding:18px;font:inherit;cursor:pointer}.category:hover,.category:focus-visible{background:#355276;outline:2px solid #a9d3ff}.category strong{display:block;font-size:18px}.category span{font-size:13px;color:#cbd9ea}.choice{display:block;width:100%;text-align:left;padding:14px 16px;margin:9px 0;background:#263b58;color:white;border:1px solid #6b86a6;border-radius:10px;font:inherit;cursor:pointer}.choice:disabled{cursor:default;opacity:.8}.choice.correct{border:2px solid #76db9c;background:#1e533e;opacity:1}.choice.wrong{border:2px solid #ff9797;background:#62383f;opacity:1}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}button.primary{background:#cbe5ff;color:#102b46;border:0;border-radius:10px;padding:12px 20px;font:inherit;font-weight:750;cursor:pointer}button.secondary{background:#32465e;color:#fff;border:1px solid #7793b4;border-radius:10px;padding:12px 20px;font:inherit;cursor:pointer}.word{font-size:clamp(32px,6vw,48px);font-weight:800;margin:16px 0}.progress{height:9px;background:#344b68;border-radius:9px;overflow:hidden}.progress>div{height:100%;background:#9bceff;transition:width .15s}.feedback{padding:14px;border-radius:10px;background:#102238;margin-top:15px}.result{font-size:30px;font-weight:800}.hidden{display:none!important}.note{font-size:13px;color:#b6c9df}button:focus-visible,a:focus-visible{outline:3px solid #c7e6ff;outline-offset:3px}
</style></head><body><main><a href="./index.html">← 教材一覧に戻る</a><h1>Web演習｜共通テスト英単語</h1><p class="muted">英単語の意味を4択で確認します。全50問・5分類、各10問。</p><section id="menu" class="panel"><h2>分類リスト</h2><div id="categories" class="categories"></div><p class="note">分野を選ぶと10問の演習を開始します。すべての問題に挑戦することもできます。</p><button id="all" class="primary" type="button">全50問に挑戦</button></section><section id="quiz" class="panel hidden" aria-live="polite"><p id="counter" class="muted"></p><div class="progress"><div id="bar"></div></div><p id="word" class="word"></p><p>最も適切な日本語の意味を選んでください。</p><div id="choices"></div><div id="feedback" class="feedback hidden" role="status"></div><div class="actions"><button id="next" class="primary hidden" type="button">次の問題へ</button><button id="back" class="secondary" type="button">分類リストに戻る</button></div></section><section id="results" class="panel hidden"><h2>採点結果</h2><p id="score" class="result"></p><p id="summary"></p><div class="actions"><button id="again" class="primary" type="button">同じ問題をもう一度</button><button id="home" class="secondary" type="button">分類リストに戻る</button></div></section></main><script>
const groups=[{"name":"基本動詞・重要表現","questions":[{"word":"maintain","choices":["破壊する","予測する","延期する","維持する"],"answer":3,"meaning":"維持する"},{"word":"require","choices":["必要とする","拒絶する","解放する","比較する"],"answer":0,"meaning":"必要とする"},{"word":"provide","choices":["奪う","提供する","隠す","消費する"],"answer":1,"meaning":"提供する"},{"word":"establish","choices":["混乱させる","輸送する","設立する","削減する"],"answer":2,"meaning":"設立する"},{"word":"indicate","choices":["疑う","妨げる","支払う","示す"],"answer":3,"meaning":"示す"},{"word":"contribute","choices":["貢献する","競争する","後悔する","回復する"],"answer":0,"meaning":"貢献する"},{"word":"obtain","choices":["配達する","入手する","失う","展示する"],"answer":1,"meaning":"入手する"},{"word":"recognize","choices":["修理する","発明する","認識する","無視する"],"answer":2,"meaning":"認識する"},{"word":"prevent","choices":["促進する","記録する","説得する","防ぐ"],"answer":3,"meaning":"防ぐ"},{"word":"expand","choices":["拡大する","縮小する","交換する","終了する"],"answer":0,"meaning":"拡大する"}]},{"name":"形容詞・副詞","questions":[{"word":"significant","choices":["一時的な","偶然の","伝統的な","重要な"],"answer":3,"meaning":"重要な"},{"word":"available","choices":["利用できる","危険な","曖昧な","独立した"],"answer":0,"meaning":"利用できる"},{"word":"appropriate","choices":["複雑な","適切な","不可能な","余分な"],"answer":1,"meaning":"適切な"},{"word":"efficient","choices":["古代の","受動的な","効率的な","高価な"],"answer":2,"meaning":"効率的な"},{"word":"accurate","choices":["急激な","不公平な","不安定な","正確な"],"answer":3,"meaning":"正確な"},{"word":"essential","choices":["不可欠な","例外的な","任意の","人工的な"],"answer":0,"meaning":"不可欠な"},{"word":"temporary","choices":["地理的な","一時的な","永続的な","典型的な"],"answer":1,"meaning":"一時的な"},{"word":"gradually","choices":["必ず","ほとんど〜ない","徐々に","突然"],"answer":2,"meaning":"徐々に"},{"word":"frequently","choices":["めったに〜ない","慎重に","偶然に","頻繁に"],"answer":3,"meaning":"頻繁に"},{"word":"relatively","choices":["比較的","完全に","意図的に","個別に"],"answer":0,"meaning":"比較的"}]},{"name":"社会・経済","questions":[{"word":"population","choices":["生産","政治","消費","人口"],"answer":3,"meaning":"人口"},{"word":"employment","choices":["雇用","輸出","教育","選挙"],"answer":0,"meaning":"雇用"},{"word":"income","choices":["貯蓄","収入","支出","税率"],"answer":1,"meaning":"収入"},{"word":"policy","choices":["物価","習慣","政策","人口密度"],"answer":2,"meaning":"政策"},{"word":"inequality","choices":["独立","協力","多様性","不平等"],"answer":3,"meaning":"不平等"},{"word":"consumer","choices":["消費者","生産者","投資家","雇用主"],"answer":0,"meaning":"消費者"},{"word":"resource","choices":["規制","資源","負債","収益"],"answer":1,"meaning":"資源"},{"word":"investment","choices":["保険","競争","投資","輸入"],"answer":2,"meaning":"投資"},{"word":"community","choices":["中央政府","金融市場","国境","地域社会"],"answer":3,"meaning":"地域社会"},{"word":"regulation","choices":["規制","需要","通貨","所得"],"answer":0,"meaning":"規制"}]},{"name":"科学・環境","questions":[{"word":"species","choices":["化石","細胞","器官","生物種"],"answer":3,"meaning":"生物種"},{"word":"habitat","choices":["生息地","大気","遺伝子","海流"],"answer":0,"meaning":"生息地"},{"word":"emission","choices":["分解","排出","吸収","蒸発"],"answer":1,"meaning":"排出"},{"word":"renewable","choices":["人工的な","絶滅した","再生可能な","有害な"],"answer":2,"meaning":"再生可能な"},{"word":"evidence","choices":["仮説","結果","誤差","証拠"],"answer":3,"meaning":"証拠"},{"word":"experiment","choices":["実験","観察者","装置","理論"],"answer":0,"meaning":"実験"},{"word":"temperature","choices":["速度","温度","湿度","気圧"],"answer":1,"meaning":"温度"},{"word":"consequence","choices":["条件","方法","結果","原因"],"answer":2,"meaning":"結果"},{"word":"preserve","choices":["汚染する","測定する","採掘する","保護する"],"answer":3,"meaning":"保護する"},{"word":"sustainable","choices":["持続可能な","不規則な","不確実な","限定的な"],"answer":0,"meaning":"持続可能な"}]},{"name":"思考・論理・抽象語","questions":[{"word":"perspective","choices":["結論","矛盾","基準","観点"],"answer":3,"meaning":"観点"},{"word":"assumption","choices":["仮定","証明","主張","選択"],"answer":0,"meaning":"仮定"},{"word":"interpret","choices":["暗記する","解釈する","反論する","省略する"],"answer":1,"meaning":"解釈する"},{"word":"evaluate","choices":["区別する","予言する","評価する","模倣する"],"answer":2,"meaning":"評価する"},{"word":"alternative","choices":["例外","欠点","義務","代替案"],"answer":3,"meaning":"代替案"},{"word":"factor","choices":["要因","目的","証拠","傾向"],"answer":0,"meaning":"要因"},{"word":"concept","choices":["規則","概念","手順","感情"],"answer":1,"meaning":"概念"},{"word":"distinguish","choices":["推測する","強調する","区別する","統合する"],"answer":2,"meaning":"区別する"},{"word":"imply","choices":["証明する","否定する","測定する","暗示する"],"answer":3,"meaning":"暗示する"},{"word":"consistent","choices":["一貫した","矛盾した","偶然の","不明瞭な"],"answer":0,"meaning":"一貫した"}]}];
const $=id=>document.getElementById(id);
let current=[],index=0,points=0,answered=false,lastSelection=-1;
function menu(){ $("menu").classList.remove("hidden");$("quiz").classList.add("hidden");$("results").classList.add("hidden");}
function start(which){current=which===-1?groups.flatMap(g=>g.questions.map(q=>({...q,group:g.name}))):groups[which].questions.map(q=>({...q,group:groups[which].name}));index=0;points=0;$("menu").classList.add("hidden");$("results").classList.add("hidden");$("quiz").classList.remove("hidden");show();}
function show(){answered=false;const q=current[index];$("counter").textContent=q.group+"｜"+(index+1)+" / "+current.length+"問";$("bar").style.width=(100*index/current.length)+"%";$("word").textContent=q.word;$("feedback").classList.add("hidden");$("next").classList.add("hidden");$("choices").replaceChildren();q.choices.forEach((c,i)=>{const b=document.createElement("button");b.type="button";b.className="choice";b.textContent=String.fromCharCode(65+i)+". "+c;b.addEventListener("click",()=>mark(i));$("choices").append(b);});}
function mark(i){if(answered)return;answered=true;const q=current[index],ok=i===q.answer;if(ok)points++;[...$("choices").children].forEach((b,j)=>{b.disabled=true;if(j===q.answer)b.classList.add("correct");else if(j===i)b.classList.add("wrong");});$("feedback").textContent=(ok?"正解！":"不正解")+"　正解："+q.meaning;$("feedback").classList.remove("hidden");$("next").textContent=index===current.length-1?"採点結果を見る":"次の問題へ";$("next").classList.remove("hidden");$("bar").style.width=(100*(index+1)/current.length)+"%";}
$("next").addEventListener("click",()=>{if(!answered)return;if(++index<current.length)show();else{$("quiz").classList.add("hidden");$("results").classList.remove("hidden");$("score").textContent=points+" / "+current.length+" 点";$("summary").textContent="正答率："+Math.round(points/current.length*100)+"％";}});
$("back").addEventListener("click",menu);$("home").addEventListener("click",menu);$("again").addEventListener("click",()=>start(lastSelection));$("all").addEventListener("click",()=>{lastSelection=-1;start(-1);});
groups.forEach((g,i)=>{const b=document.createElement("button");b.className="category";b.type="button";const strong=document.createElement("strong");strong.textContent=g.name;const small=document.createElement("span");small.textContent=g.questions.length+"問｜英単語の意味選択";b.append(strong,small);b.addEventListener("click",()=>{lastSelection=i;start(i);});$("categories").append(b);});
</script></body></html>
