let current=[],index=0,points=0,answered=false,lastSelection=-1,quizMode="英語";
function menu(){ $("menu").classList.remove("hidden");$("quiz").classList.add("hidden");$("results").classList.add("hidden");}
function start(which){quizMode=which===-11||which<=-40||which===-10||which<=-20?"化学":"英語";const selected=which===-11?organicGroups:which<=-40?[organicGroups[-40-which]]:which===-10?chemistryGroups:which<=-20?[chemistryGroups[-20-which]]:which===-1?groups:which===-2?advancedGroups:which===-3?allGroups:[allGroups[which]];current=selected.flatMap(g=>g.questions.map(q=>({...q,group:g.name})));index=0;points=0;$("menu").classList.add("hidden");$("results").classList.add("hidden");$("quiz").classList.remove("hidden");show();}
function show(){answered=false;$("instruction").textContent=quizMode==="化学"?"最も適切なものを1つ選んでください。":"最も適切な日本語の意味を選んでください。";const q=current[index];$("counter").textContent=q.group+"｜"+(index+1)+" / "+current.length+"問";$("bar").style.width=(100*index/current.length)+"%";$("word").textContent=q.word;$("feedback").classList.add("hidden");$("next").classList.add("hidden");$("choices").replaceChildren();q.choices.forEach((c,i)=>{const b=document.createElement("button");b.type="button";b.className="choice";b.textContent=String.fromCharCode(65+i)+". "+c;b.addEventListener("click",()=>mark(i));$("choices").append(b);});}
function mark(i){if(answered)return;answered=true;const q=current[index],ok=i===q.answer;if(ok)points++;[...$("choices").children].forEach((b,j)=>{b.disabled=true;if(j===q.answer)b.classList.add("correct");else if(j===i)b.classList.add("wrong");});$("feedback").textContent=(ok?"正解！":"不正解")+"　正解："+q.meaning;$("feedback").classList.remove("hidden");$("next").textContent=index===current.length-1?"採点結果を見る":"次の問題へ";$("next").classList.remove("hidden");$("bar").style.width=(100*(index+1)/current.length)+"%";}
$("next").addEventListener("click",()=>{if(!answered)return;if(++index<current.length)show();else{$("quiz").classList.add("hidden");$("results").classList.remove("hidden");$("score").textContent=points+" / "+current.length+" 点";$("summary").textContent="正答率："+Math.round(points/current.length*100)+"％";}});
$("back").addEventListener("click",menu);$("home").addEventListener("click",menu);$("again").addEventListener("click",()=>start(lastSelection));
const subjects=["英語","数学","国語","理科","社会","情報"];
subjects.forEach(subject=>{
 const details=document.createElement("details");details.className="subject-group subject-"+subject;details.open=subject==="英語";
 const summary=document.createElement("summary");summary.textContent=subject;
 const count=document.createElement("span");count.className="subject-count";count.textContent=subject==="英語"?"100問・2セット":subject==="理科"?"化学150問（基本100・有機50）":"準備中";summary.append(count);
 const inner=document.createElement("div");inner.className="subject-inner";
 if(subject==="英語"){
  const desc=document.createElement("p");desc.className="muted";desc.textContent="共通テスト英単語：基本50問／差がつく発展50問";inner.append(desc);
  const englishPanel=document.createElement("div");englishPanel.className="english-panel";
  const tabs=document.createElement("div");tabs.className="english-tabs";tabs.setAttribute("role","group");tabs.setAttribute("aria-label","英語の難易度");
  const content=document.createElement("div");content.className="english-content";
  const tabButtons=[];
  function showEnglishSet(level){
    tabButtons.forEach((b,i)=>{const active=i===level;b.classList.toggle("active",active);b.setAttribute("aria-pressed",String(active));});
    content.replaceChildren();
    const items=level===0?groups:advancedGroups;
    const description=document.createElement("p");description.className="english-set-description";
    description.textContent=level===0?"基本英単語50問｜重要語句を確認":"発展英単語50問｜難関大にも役立つ語彙";
    const startAll=document.createElement("button");startAll.className="primary english-start";startAll.type="button";
    startAll.textContent=level===0?"基本50問をまとめて解く":"発展50問をまとめて解く";
    startAll.addEventListener("click",()=>{lastSelection=level===0?-1:-2;start(lastSelection);});
    const details=document.createElement("details");details.className="english-topics";
    const summary=document.createElement("summary");summary.textContent="分野別に10問ずつ解く（全5分野）";
    const categories=document.createElement("div");categories.className="english-topic-grid";
    items.forEach((g,i)=>{
      const button=document.createElement("button");button.className="category";button.type="button";
      const strong=document.createElement("strong");strong.textContent=g.name;
      const small=document.createElement("span");small.textContent="10問・4択";
      button.append(strong,small);
      button.addEventListener("click",()=>{lastSelection=level*5+i;start(lastSelection);});
      categories.append(button);
    });
    details.append(summary,categories);
    content.append(description,startAll,details);
  }
  ["基本 50問","発展 50問"].forEach((name,i)=>{
    const button=document.createElement("button");button.type="button";button.className="english-tab";button.textContent=name;
    button.addEventListener("click",()=>showEnglishSet(i));tabButtons.push(button);tabs.append(button);
  });
  englishPanel.append(tabs,content);
  const hundred=document.createElement("button");hundred.className="secondary english-hundred";hundred.type="button";
  hundred.textContent="全100問に挑戦";
  hundred.addEventListener("click",()=>{lastSelection=-3;start(-3);});
  englishPanel.append(hundred);inner.append(englishPanel);showEnglishSet(0);
 }else if(subject==="理科"){
  const heading=document.createElement("h3");heading.textContent="化学｜基本知識100問";inner.append(heading);
  const desc=document.createElement("p");desc.className="muted";desc.textContent="高校化学の基礎知識を10分野・各10問で確認。4択・即時採点。";inner.append(desc);
  const categories=document.createElement("div");categories.className="categories";
  chemistryGroups.forEach((g,i)=>{const button=document.createElement("button");button.className="category";button.type="button";const strong=document.createElement("strong");strong.textContent=g.name;const small=document.createElement("span");small.textContent="10問｜4択・自動採点";button.append(strong,small);button.addEventListener("click",()=>{lastSelection=-20-i;start(lastSelection);});categories.append(button);});
  inner.append(categories);
  const all=document.createElement("button");all.className="primary";all.type="button";all.textContent="化学 基本100問に挑戦";all.addEventListener("click",()=>{lastSelection=-10;start(-10);});inner.append(all);
  const oh=document.createElement("h3");oh.textContent="有機化学｜特化50問";oh.style.marginTop="28px";inner.append(oh);
  const od=document.createElement("p");od.className="muted";od.textContent="脂肪族・官能基・芳香族・構造決定・高分子を各10問。4択・即時採点。";inner.append(od);
  const oc=document.createElement("div");oc.className="categories";organicGroups.forEach((g,i)=>{const b=document.createElement("button");b.type="button";b.className="category";const st=document.createElement("strong");st.textContent=g.name;const sm=document.createElement("span");sm.textContent="10問｜4択・自動採点";b.append(st,sm);b.addEventListener("click",()=>{lastSelection=-40-i;start(lastSelection);});oc.append(b);});inner.append(oc);
  const oa=document.createElement("button");oa.className="primary";oa.type="button";oa.textContent="有機化学50問に挑戦";oa.style.marginTop="16px";oa.addEventListener("click",()=>{lastSelection=-11;start(-11);});inner.append(oa);
 }else{const p=document.createElement("p");p.className="coming";p.textContent="この科目のWeb演習は準備中です。";inner.append(p);}
 details.append(summary,inner);$("subject-list").append(details);
});
</script></body></html>
