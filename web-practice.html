<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Web演習 | PDF教材ライブラリ</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#e9eef7;font:16px/1.7 system-ui,sans-serif}main{max-width:760px;margin:35px auto;padding:20px}a{color:#a9ccff}.panel{background:#1d2a3d;border:1px solid #536b8b;border-radius:16px;padding:24px}h1{font-size:32px}label{display:block;margin:15px 0 6px;font-weight:700}select,input{width:100%;padding:13px;background:#0e1b2c;color:white;border:1px solid #8198b9;border-radius:8px;font-size:17px}button{margin-top:16px;padding:12px 22px;background:#cce5ff;color:#132c48;border:0;border-radius:9px;font-weight:800;font-size:17px;cursor:pointer}.feedback{margin-top:20px;padding:16px;background:#142238;border-radius:10px}.ok{color:#9be5b5}.ng{color:#ffb3b3}.question{font-size:20px;font-weight:700}</style></head><body><main><a href="./index.html">← 教材一覧に戻る</a><h1>✎ Web演習</h1><p>解答を入力してその場で採点できます。現在は各分類のサンプル問題を用意しています。</p><div class="panel"><label for="topic">分類</label><select id="topic"><option>漢字</option><option>英単語</option><option>化学</option><option>社会</option><option>情報</option></select><p id="question" class="question"></p><form id="quiz"><label for="answer">解答</label><input id="answer" autocomplete="off" required><button type="submit">採点する</button></form><div id="feedback" class="feedback" role="status" aria-live="polite" hidden></div><button id="retry" type="button" hidden>もう一度解く</button></div></main><script>
const questions={"漢字":{q:"「けんちょな増加」の「けんちょ」を漢字で書いてください。",a:["顕著"],display:"顕著",explain:"際立って目につくことを意味します。"},"英単語":{q:"「達成する」を意味する英単語を入力してください。",a:["achieve"],display:"achieve",explain:"目標や目的を達成するという意味です。"},"化学":{q:"25℃の純水の水素イオン濃度（mol/L）を指数表記で入力してください。",a:["1e-7","1.0e-7","10^-7","1×10^-7"],display:"1.0×10⁻⁷ mol/L",explain:"25℃の純水では [H⁺]=[OH⁻]=1.0×10⁻⁷ mol/L です。"},"社会":{q:"日本国憲法が施行された西暦年は？",a:["1947","1947年"],display:"1947年",explain:"1946年11月3日に公布、1947年5月3日に施行されました。"},"情報":{q:"2進数 1011 を10進数で表してください。",a:["11"],display:"11",explain:"8+0+2+1=11 です。"}};
const topic=document.getElementById("topic"),question=document.getElementById("question"),answer=document.getElementById("answer"),feedback=document.getElementById("feedback"),retry=document.getElementById("retry");const norm=s=>s.normalize("NFKC").trim().toLowerCase().replace(/\s+/g,"");function reset(){question.textContent=questions[topic.value].q;answer.value="";feedback.hidden=true;retry.hidden=true}topic.addEventListener("change",reset);document.getElementById("quiz").addEventListener("submit",e=>{e.preventDefault();const q=questions[topic.value],ok=q.a.some(a=>norm(a)===norm(answer.value));feedback.replaceChildren();const verdict=document.createElement("strong");verdict.className=ok?"ok":"ng";verdict.textContent=ok?"正解！":"不正解";const detail=document.createElement("p");detail.textContent="模範解答："+q.display+" — "+q.explain;feedback.append(verdict,detail);feedback.hidden=false;retry.hidden=false});retry.addEventListener("click",reset);reset();
</script></body></html>
