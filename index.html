<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大学入試 PDF教材ライブラリ</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#101827;color:#e9eef7;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
header{padding:35px 6%;background:#192439}
header h1{margin:0 0 10px;font-size:clamp(1.35rem,4vw,2rem)}
header p{color:#a9b9d0;margin:0}
main{max-width:1100px;margin:auto;padding:30px 20px}
nav{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:25px}
nav a{padding:9px 14px;background:#1d2a3d;border-radius:8px;text-decoration:none;font-weight:600}
nav a:hover,nav a:focus-visible{background:#2e4059}
input{width:100%;padding:14px;margin-bottom:16px;background:#1c293d;border:1px solid #485771;border-radius:9px;color:white;font-size:16px}
#status{color:#a9b9d0;margin:0 0 20px;min-height:1.5em}
#materials{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:16px}
article{background:#1d2a3d;padding:22px;border-radius:12px;min-width:0}
article h2{font-size:18px;margin:0 0 12px}
article h2 .count{font-size:13px;font-weight:400;color:#aebdd0;margin-left:8px}
article:target{outline:2px solid #a9ccff}
details+details{border-top:1px solid #354156}
summary{cursor:pointer;padding:12px 0;font-weight:550}
.category-count{font-size:12px;color:#aebdd0;margin-left:8px}
ul{padding:0;list-style:none;margin:0 0 14px}
li+li{border-top:1px solid #354156}
li a{display:block;padding:11px 2px;color:#a9ccff;text-decoration:none;overflow-wrap:anywhere}
li a:hover,li a:focus-visible{text-decoration:underline}
.subject-tag{display:inline-block;font-size:12px;font-weight:600;color:#e9eef7;background:#35445d;border-radius:5px;padding:2px 7px;margin:0 8px 4px 0}
.pdf-title{vertical-align:middle}
.missing{color:#aebdd0;margin:4px 0 14px;font-size:14px}
#empty{color:#aebdd0}
a:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid #a9ccff;outline-offset:3px}

.countdown{max-width:1100px;margin:0 auto;padding:22px 20px 0}
.countdown-panel{background:linear-gradient(125deg,#1e3049,#172338);border:1px solid #3d5474;border-radius:14px;padding:22px 24px;text-align:center}
.countdown-label{color:#b9cce6;font-weight:650;letter-spacing:.05em;margin:0 0 8px}
.countdown-date{color:#a9b9d0;font-size:13px;margin:12px 0 0}
.countdown-units{display:flex;align-items:baseline;justify-content:center;gap:clamp(10px,3vw,28px);flex-wrap:wrap}
.countdown-unit{display:flex;align-items:baseline;gap:5px}
.countdown-number{font-size:clamp(2rem,6vw,3.7rem);font-weight:750;font-variant-numeric:tabular-nums;color:#fff;line-height:1.25}
.countdown-suffix{font-size:14px;color:#b9cce6}
@media(max-width:460px){.countdown-panel{padding:18px 10px}.countdown-units{gap:10px}.countdown-number{font-size:clamp(1.6rem,7vw,2.4rem)}}

.exam-day-message{font-size:clamp(1.3rem,4vw,2rem);font-weight:750;color:#fff;line-height:1.5}\n
/* 都市写真を鮮明に見せ、教材カードは可読性を確保 */
body{min-height:100vh;position:relative;background:#101827;isolation:isolate}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background-image:var(--landscape-image,none);background-size:cover;background-position:center 40%;background-repeat:no-repeat;filter:saturate(.82) contrast(.96) brightness(1.04)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(5,12,24,.12) 0%,rgba(5,12,24,.2) 42%,rgba(5,12,24,.28) 100%)}
header{background:rgba(10,23,42,.48);backdrop-filter:blur(5px)}
header h1,header p{text-shadow:0 2px 12px rgba(0,0,0,.8)}
article{background:rgba(15,27,45,.81);border:1px solid rgba(202,223,248,.23);box-shadow:0 8px 24px rgba(0,0,0,.23);backdrop-filter:blur(7px)}
.countdown-panel{background:linear-gradient(125deg,rgba(19,37,62,.79),rgba(15,28,49,.8));border:1px solid rgba(204,224,249,.32);backdrop-filter:blur(7px)}
nav a{background:rgba(16,31,52,.83);backdrop-filter:blur(5px)}
input{background:rgba(14,27,47,.9);border-color:#8ba5c5}
.weather-strip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 6%;font-size:13px;color:#fff;background:rgba(10,25,44,.6);border-top:1px solid rgba(255,255,255,.12);text-shadow:0 1px 5px rgba(0,0,0,.65)}
.weather-strip button{background:rgba(28,55,87,.92);color:#fff;border:1px solid #8da8c8;border-radius:7px;padding:7px 10px;cursor:pointer}
.weather-strip button:hover{background:#365273}
.weather-strip button:focus-visible{outline:2px solid #a9ccff;outline-offset:2px}
@media(prefers-reduced-motion:reduce){body::before{transition:none}}

/* 月別の控えめな季節装飾：カウントダウンだけに適用 */
.countdown-panel{position:relative;overflow:hidden;isolation:isolate}
.countdown-panel::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--month-glow,linear-gradient(120deg,rgba(112,156,206,.12),transparent));pointer-events:none}
.countdown-panel::after{content:var(--month-motif,"✦  ✧  ✦");position:absolute;right:18px;top:50%;transform:translateY(-50%);color:var(--month-accent,#c8dbf3);opacity:.24;font-size:clamp(48px,8vw,100px);letter-spacing:.06em;white-space:nowrap;pointer-events:none}
.countdown-label{color:var(--month-accent,#b9cce6)}
.countdown-panel{border-color:var(--month-border,rgba(204,224,249,.32))}
.month-caption{font-size:12px;color:#d4e1f1;margin:9px 0 0;letter-spacing:.04em}
@media(max-width:460px){.countdown-panel::after{font-size:46px;right:5px;top:50%;opacity:.17}}

/* 11月限定：カウントダウンの左右から紅葉が舞い落ちる */
.autumn-leaves{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;display:none}
.countdown-panel.is-november .autumn-leaves{display:block}
.autumn-leaf{position:absolute;top:-45px;left:var(--leaf-x);font-size:var(--leaf-size);opacity:0;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25));animation:falling-maple var(--leaf-duration) linear infinite;animation-delay:var(--leaf-delay);will-change:transform,opacity}
@keyframes falling-maple{
  0%{transform:translate3d(0,-30px,0) rotate(-25deg);opacity:0}
  12%{opacity:.72}
  45%{transform:translate3d(var(--leaf-sway),105px,0) rotate(90deg);opacity:.76}
  85%{opacity:.68}
  100%{transform:translate3d(calc(var(--leaf-sway) * -0.5),310px,0) rotate(260deg);opacity:0}
}
.countdown-panel.is-november::after{content:none}
.countdown-panel>.countdown-label,.countdown-panel>.countdown-units,.countdown-panel>.countdown-date,.countdown-panel>.month-caption{position:relative;z-index:1}
@media(max-width:460px){.autumn-leaf{opacity:.55}@keyframes falling-maple{0%{transform:translateY(-30px) rotate(-25deg);opacity:0}12%{opacity:.52}85%{opacity:.48}100%{transform:translateY(310px) rotate(260deg);opacity:0}}}
@media(prefers-reduced-motion:reduce){.autumn-leaf{animation:none;opacity:.42;top:var(--leaf-static-y)}}

/* 共通テスト・二次試験・基礎事項の下位分類 */
.topic-group{margin:7px 0 9px 10px;padding:0 0 0 12px;border-left:2px solid rgba(169,204,255,.28)}
.topic-group+ .topic-group{border-top:0}
.topic-group>summary{padding:9px 0;color:#dceaff;font-size:14px}
.topic-group .category-count{color:#b8c9dc}
.topic-group ul{margin-bottom:8px}
.topic-group li a{padding:9px 2px}
</style>
</head>
<body>
<header><h1>大学入試 PDF教材ライブラリ</h1><p>共通テスト・難関大学入試対策</p></header>
<div class="weather-strip"><span id="weather-description" role="status" aria-live="polite">時間帯に合わせた背景を表示中</span><button id="weather-location" type="button">現在地の天気を反映</button></div>

<section class="countdown" aria-label="大学入学共通テストまでの残り時間">
  <div class="countdown-panel">
    <div class="autumn-leaves" aria-hidden="true"></div>
    <p class="countdown-label">2027年度 大学入学共通テストまで</p>
    <div id="countdown-units" class="countdown-units" role="timer" aria-live="off">
      <span class="countdown-unit"><span id="days" class="countdown-number">--</span><span class="countdown-suffix">日</span></span>
      <span class="countdown-unit"><span id="hours" class="countdown-number">--</span><span class="countdown-suffix">時間</span></span>
      <span class="countdown-unit"><span id="minutes" class="countdown-number">--</span><span class="countdown-suffix">分</span></span>
      <span class="countdown-unit"><span id="seconds" class="countdown-number">--</span><span class="countdown-suffix">秒</span></span>
    </div>
    <p id="countdown-date" class="countdown-date">本試験：2027年1月16日（土）・17日（日）</p>
    <p id="month-caption" class="month-caption" aria-live="off"></p>
  </div>
</section>

<main>
<nav aria-label="科目">
<a href="#subject-英語" style="color:#81b4ff">英語</a>
<a href="#subject-数学" style="color:#ffae66">数学</a>
<a href="#subject-国語" style="color:#ff9292">国語</a>
<a href="#subject-理科" style="color:#79d8a1">理科</a>
<a href="#subject-社会" style="color:#ecd775">社会</a>
<a href="#subject-情報" style="color:#c6a3ff">情報</a>
</nav>
<input type="search" id="search" aria-label="教材を検索" placeholder="教材名・単元・科目を検索">
<p id="status" role="status" aria-live="polite">教材一覧を読み込み中…</p>
<section id="materials" aria-label="教材一覧"></section>
<p id="empty" hidden>一致する教材はありません。</p>
</main>
<script>
"use strict";

/* 天気はOpen-Meteo（APIキー不要）。初期値は東京、位置情報はボタン操作時だけ利用。 */
const BACKGROUND_PHOTOS={
  morning:"https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?auto=format&fit=crop&w=2400&q=85",
  day:"https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=2400&q=85",
  evening:"https://images.unsplash.com/photo-1513407030348-c983a97b98d8?auto=format&fit=crop&w=2400&q=85",
  night:"https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=2400&q=85",
  rain:"https://images.unsplash.com/photo-1513407030348-c983a97b98d8?auto=format&fit=crop&w=2400&q=85",
  cloudy:"https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?auto=format&fit=crop&w=2400&q=85",
  snow:"https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=2400&q=85"
};
const weatherDescription=document.getElementById("weather-description");
const weatherLocation=document.getElementById("weather-location");
let currentWeatherCode=null;
let weatherArea="東京";
function timeScene(){
  const hour=new Date().getHours();
  return hour>=5&&hour<10?"morning":hour>=10&&hour<17?"day":hour>=17&&hour<19?"evening":"night";
}
function weatherScene(code){
  if(code===null)return null;
  if(code>=71&&code<=86)return "snow";
  if(code>=51&&code<=67||code>=80&&code<=82||code>=95)return "rain";
  if(code>=2&&code<=3||code===45||code===48)return "cloudy";
  return null;
}
function applyBackground(){
  const scene=weatherScene(currentWeatherCode)||timeScene();
  document.documentElement.style.setProperty("--landscape-image",'url("'+BACKGROUND_PHOTOS[scene]+'")');
  const timeNames={morning:"朝",day:"昼",evening:"夕方",night:"夜"};
  const weatherNames={rain:"雨",cloudy:"曇り",snow:"雪"};
  weatherDescription.textContent=(currentWeatherCode===null?"時刻に連動":weatherArea+"の天気に連動")+" · "+(weatherNames[scene]||timeNames[scene])+"の風景";
}
async function loadWeather(latitude,longitude,area){
  try{
    const url=new URL("https://api.open-meteo.com/v1/forecast");
    url.search=new URLSearchParams({latitude:String(latitude),longitude:String(longitude),current:"weather_code",timezone:"auto"}).toString();
    const response=await fetch(url,{cache:"no-store"});
    if(!response.ok)throw new Error("天気API: "+response.status);
    const result=await response.json();
    if(typeof result.current?.weather_code!=="number")throw new Error("天気データなし");
    currentWeatherCode=result.current.weather_code;
    weatherArea=area;
  }catch(error){
    currentWeatherCode=null;
    console.warn("天気取得に失敗したため時刻ベースの背景を使用:",error);
  }
  applyBackground();
}
weatherLocation.addEventListener("click",()=>{
  if(!navigator.geolocation){
    weatherDescription.textContent="位置情報に非対応のため、東京の天気を使用します";
    return;
  }
  weatherDescription.textContent="現在地の天気を取得しています…";
  navigator.geolocation.getCurrentPosition(
    position=>loadWeather(position.coords.latitude,position.coords.longitude,"現在地"),
    ()=>{weatherDescription.textContent="位置情報を利用できません。東京の天気を表示します";loadWeather(35.6762,139.6503,"東京");},
    {enableHighAccuracy:false,timeout:10000,maximumAge:600000}
  );
});
applyBackground();
loadWeather(35.6762,139.6503,"東京");
setInterval(()=>{applyBackground();},60000);
setInterval(()=>{if(weatherArea==="東京")loadWeather(35.6762,139.6503,"東京");},30*60*1000);



/* 端末の月に応じた季節モチーフ。毎日更新して月替わりに追従 */
const MONTH_THEMES=[
  {name:"睦月",desc:"新春の門松",motif:"🎍",accent:"#cce9ff",border:"rgba(173,219,250,.48)",glow:"linear-gradient(120deg,rgba(108,179,231,.24),transparent 72%)"},
  {name:"如月",desc:"節分の鬼のお面",motif:"👹",accent:"#d9e3ff",border:"rgba(196,208,252,.46)",glow:"linear-gradient(120deg,rgba(136,151,222,.22),transparent 72%)"},
  {name:"弥生",desc:"春の訪れ",motif:"✿  ❀  ✿",accent:"#ffd2e1",border:"rgba(255,180,208,.48)",glow:"linear-gradient(120deg,rgba(234,119,166,.22),transparent 72%)"},
  {name:"卯月",desc:"桜の季節",motif:"❀  ✿  ❀",accent:"#ffd6e8",border:"rgba(255,190,216,.5)",glow:"linear-gradient(120deg,rgba(246,144,181,.24),transparent 72%)"},
  {name:"皐月",desc:"新緑の季節",motif:"❧  ✦  ❧",accent:"#baf1d1",border:"rgba(149,232,181,.45)",glow:"linear-gradient(120deg,rgba(72,168,112,.23),transparent 72%)"},
  {name:"水無月",desc:"雨と紫陽花",motif:"☂  ✧  ☂",accent:"#c4d8ff",border:"rgba(158,186,245,.47)",glow:"linear-gradient(120deg,rgba(95,123,210,.23),transparent 72%)"},
  {name:"文月",desc:"夏の青空",motif:"☀  ✦  ☀",accent:"#ffe3a4",border:"rgba(248,210,130,.48)",glow:"linear-gradient(120deg,rgba(238,168,68,.24),transparent 72%)"},
  {name:"葉月",desc:"盛夏の光",motif:"✺  ☀  ✺",accent:"#ffd49d",border:"rgba(250,181,109,.48)",glow:"linear-gradient(120deg,rgba(242,138,52,.25),transparent 72%)"},
  {name:"長月",desc:"秋の始まり",motif:"☾  ✧  ☾",accent:"#f4d5ac",border:"rgba(230,185,131,.46)",glow:"linear-gradient(120deg,rgba(189,133,75,.22),transparent 72%)"},
  {name:"神無月",desc:"深まる秋",motif:"❧  ✦  ❧",accent:"#ffd0a3",border:"rgba(242,160,104,.48)",glow:"linear-gradient(120deg,rgba(200,105,58,.24),transparent 72%)"},
  {name:"霜月",desc:"色づく紅葉",motif:"🍁",accent:"#ffd6b3",border:"rgba(234,167,111,.46)",glow:"linear-gradient(120deg,rgba(177,97,54,.23),transparent 72%)"},
  {name:"師走",desc:"舞い降りる粉雪",motif:"❄ ❅ ❄",accent:"#d2e4ff",border:"rgba(172,206,247,.49)",glow:"linear-gradient(120deg,rgba(92,143,205,.25),transparent 72%)"}
];

const autumnLeaves=document.querySelector(".autumn-leaves");
for(let i=0;i<12;i++){
  const leaf=document.createElement("span");
  leaf.className="autumn-leaf";
  leaf.textContent=i%3===0?"🍂":"🍁";
  const side=i<6;
  const offset=4+(i%6)*5;
  leaf.style.setProperty("--leaf-x",side?offset+"%":(100-offset)+"%");
  leaf.style.setProperty("--leaf-size",(20+i%4*5)+"px");
  leaf.style.setProperty("--leaf-duration",(7+i%5*1.3)+"s");
  leaf.style.setProperty("--leaf-delay",(-i*1.45)+"s");
  leaf.style.setProperty("--leaf-sway",(side?1:-1)*(12+i%4*8)+"px");
  leaf.style.setProperty("--leaf-static-y",(i%6*19+14)+"px");
  autumnLeaves.append(leaf);
}

function updateMonthTheme(){
  const month=new Date().getMonth();
  const theme=MONTH_THEMES[month];
  const panel=document.querySelector(".countdown-panel");
  panel.classList.toggle("is-november",month===10);
  panel.style.setProperty("--month-accent",theme.accent);
  panel.style.setProperty("--month-border",theme.border);
  panel.style.setProperty("--month-glow",theme.glow);
  panel.style.setProperty("--month-motif",JSON.stringify(theme.motif));
  document.getElementById("month-caption").textContent=(month+1)+"月・"+theme.name+" — "+theme.desc;
}
updateMonthTheme();
setInterval(updateMonthTheme,60*60*1000);

const examStart = Date.parse("2027-01-16T09:30:00+09:00");
const day1Start = Date.parse("2027-01-16T00:00:00+09:00");
const day2Start = Date.parse("2027-01-17T00:00:00+09:00");
const examEnd = Date.parse("2027-01-18T00:00:00+09:00");
const secondExamStart = Date.parse("2027-02-25T09:00:00+09:00");
const countdownLabel = document.querySelector(".countdown-label");
const countdownDate = document.getElementById("countdown-date");
const countdownUnits = document.getElementById("countdown-units");
const countdownTemplate = countdownUnits.innerHTML;
function showCountdown(target){
  if(!document.getElementById("days")){
    countdownUnits.innerHTML=countdownTemplate;
    countdownUnits.classList.remove("exam-day-message");
  }
  const remaining=Math.max(0,Math.ceil((target-Date.now())/1000));
  document.getElementById("days").textContent=Math.floor(remaining/86400);
  document.getElementById("hours").textContent=String(Math.floor(remaining%86400/3600)).padStart(2,"0");
  document.getElementById("minutes").textContent=String(Math.floor(remaining%3600/60)).padStart(2,"0");
  document.getElementById("seconds").textContent=String(remaining%60).padStart(2,"0");
}
function showMessage(message){
  countdownUnits.classList.add("exam-day-message");
  if(countdownUnits.textContent!==message)countdownUnits.textContent=message;
}
function updateCountdown(){
  const now=Date.now();
  if(now<day1Start){
    countdownLabel.textContent="2027年度 大学入学共通テストまで";
    countdownDate.textContent="本試験：2027年1月16日（土）・17日（日）";
    showCountdown(examStart);
  }else if(now<day2Start){
    countdownLabel.textContent="2027年度 大学入学共通テスト 1日目";
    countdownDate.textContent="1日目：2027年1月16日（土）";
    showMessage("いよいよ本番です、頑張りましょう！");
  }else if(now<examEnd){
    countdownLabel.textContent="2027年度 大学入学共通テスト 2日目";
    countdownDate.textContent="2日目：2027年1月17日（日）";
    showMessage("いよいよ本番です、頑張りましょう！");
  }else if(now<secondExamStart){
    countdownLabel.textContent="2027年度 国公立大学二次試験（前期日程）まで";
    countdownDate.textContent="前期日程：2027年2月25日（木）から（大学・学部により異なります）";
    showCountdown(secondExamStart);
  }else{
    countdownLabel.textContent="2027年度 国公立大学二次試験（前期日程）";
    countdownDate.textContent="前期日程：2027年2月25日（木）から（大学・学部により異なります）";
    showMessage("二次試験本番です。これまでの成果を発揮しましょう！");
  }
}
updateCountdown();
setInterval(updateCountdown,1000);

const SUBJECTS = [
  {name:"英語",color:"#81b4ff"},
  {name:"数学",color:"#ffae66"},
  {name:"国語",color:"#ff9292"},
  {name:"理科",color:"#79d8a1"},
  {name:"社会",color:"#ecd775"},
  {name:"情報",color:"#c6a3ff"}
];
const CATEGORIES = ["共通テスト用","二次試験用","基礎確認事項"];
const SUBJECT_ALIASES = {
  "英語":["英文法","英作文","リーディング","リスニング"],
  "数学":["数Ⅰ","数Ⅱ","数Ⅲ","数A","数B","数C","論理"],
  "国語":["現代文","古文","漢文"],
  "理科":["物理","化学","生物","地学","科学"],
  "社会":["地理","歴史","日本史","世界史","政治経済","公共","公民"],
  "情報":["情報Ⅰ","情報I","プログラミング"]
};

const TOPICS={
  "理科":["物理","化学","生物","地学"],
  "社会":["日本史","世界史","地理","政治経済"],
  "数学":["数学1A","数学2B","数学3C"],
  "国語":["現代文","古文","漢文"]
};
function classifyTopic(item){
  const topics=TOPICS[item.subject];
  if(!topics)return null;
  const parts=item.file.split("/");
  if(parts.length>3 && topics.includes(parts[2]))return parts[2];
  const value=(item.title+" "+parts.slice(3).join(" ")).normalize("NFKC").toLowerCase();
  if(item.subject==="理科"){
    if(/物理|力学|電磁気|熱力学|波動|単振動|万有引力|円運動/.test(value))return "物理";
    if(/化学|アミノ酸|高分子|金属イオン|気液平衡|脂肪酸|糖類|有機|無機/.test(value))return "化学";
    if(/生物|遺伝|細胞/.test(value))return "生物";
    if(/地学|地震|気象|天文/.test(value))return "地学";
  }
  if(item.subject==="社会"){
    if(/日本史/.test(value))return "日本史";
    if(/世界史/.test(value))return "世界史";
    if(/地理|地誌/.test(value))return "地理";
    if(/政治|経済|公共|公民/.test(value))return "政治経済";
  }
  if(item.subject==="数学"){
    if(/数学\s*(iii|Ⅲ|3)\s*c?|数\s*(iii|Ⅲ|3)|数学3c|数3c|数Ⅲ|微積|極限|複素数平面/.test(value))return "数学3C";
    if(/数学\s*(ii|Ⅱ|2)\s*(b|bc)?|数\s*(ii|Ⅱ|2)|数学2b|数2b|数列|ベクトル/.test(value))return "数学2B";
    if(/数学\s*(i|Ⅰ|1)\s*a?|数\s*(i|Ⅰ|1)|数学1a|数1a|確率|整数|図形の性質/.test(value))return "数学1A";
  }
  if(item.subject==="国語"){
    if(/現代文|評論|小説/.test(value))return "現代文";
    if(/古文|古語|古典単語/.test(value))return "古文";
    if(/漢文|漢詩/.test(value))return "漢文";
  }
  return "その他・未分類";
}
function createMaterialList(items){
  const list=document.createElement("ul");
  for(const item of items){
    const li=document.createElement("li");
    const a=document.createElement("a");
    a.href=item.file.split("/").map(encodeURIComponent).join("/");
    const tag=document.createElement("span");
    tag.className="subject-tag";
    tag.textContent=item.subject;
    const title=document.createElement("span");
    title.className="pdf-title";
    title.textContent=item.title;
    a.append(tag,title);
    a.setAttribute("aria-label",item.subject+" "+item.category+" "+item.title);
    a.target="_blank";
    a.rel="noopener noreferrer";
    li.append(a);list.append(li);
  }
  return list;
}

const search = document.getElementById("search");
const container = document.getElementById("materials");
const statusText = document.getElementById("status");
const empty = document.getElementById("empty");
let allMaterials = [];
function valid(item){
  return item && typeof item.title==="string" && typeof item.file==="string" &&
    SUBJECTS.some(s=>s.name===item.subject) && CATEGORIES.includes(item.category) &&
    !item.file.startsWith("/") && !item.file.includes("..") &&
    item.file.startsWith(item.subject+"/"+item.category+"/") && /\.pdf$/i.test(item.file);
}
function searchableText(item){
  return [item.title,item.subject,item.category,item.file,classifyTopic(item)||"",...(SUBJECT_ALIASES[item.subject]||[])].join(" ").normalize("NFKC").toLocaleLowerCase("ja");
}
function render(){
  const terms=search.value.trim().normalize("NFKC").toLocaleLowerCase("ja").split(/\s+/).filter(Boolean);
  const data=allMaterials.filter(item=>terms.every(t=>searchableText(item).includes(t)));
  container.replaceChildren();
  let visible=0;
  for(const subject of SUBJECTS){
    const own=data.filter(item=>item.subject===subject.name);
    if(terms.length && !own.length) continue;
    visible++;
    const article=document.createElement("article");
    article.id="subject-"+subject.name;
    article.style.borderTop="4px solid "+subject.color;
    const h2=document.createElement("h2");
    h2.textContent=subject.name;
    const count=document.createElement("span");
    count.className="count";
    count.textContent=own.length+" 件";
    h2.append(count);
    article.append(h2);
    for(const category of CATEGORIES){
      const items=own.filter(item=>item.category===category);
      if(terms.length && !items.length) continue;
      const detail=document.createElement("details");
      detail.open=terms.length>0;
      const summary=document.createElement("summary");
      summary.append(document.createTextNode(category));
      const n=document.createElement("span");
      n.className="category-count";
      n.textContent="("+items.length+")";
      summary.append(n);
      detail.append(summary);
      if(TOPICS[subject.name]){
        const groups=[...TOPICS[subject.name],"その他・未分類"];
        for(const topic of groups){
          const topicItems=items.filter(item=>classifyTopic(item)===topic);
          if(terms.length && !topicItems.length)continue;
          if(topic==="その他・未分類" && !topicItems.length)continue;
          const group=document.createElement("details");
          group.className="topic-group";
          group.open=terms.length>0;
          const topicSummary=document.createElement("summary");
          topicSummary.append(document.createTextNode(topic));
          const topicCount=document.createElement("span");
          topicCount.className="category-count";
          topicCount.textContent="("+topicItems.length+")";
          topicSummary.append(topicCount);
          group.append(topicSummary);
          if(topicItems.length)group.append(createMaterialList(topicItems));
          else{
            const p=document.createElement("p");
            p.className="missing";
            p.textContent="教材はまだありません";
            group.append(p);
          }
          detail.append(group);
        }
      }else if(items.length){
        detail.append(createMaterialList(items));
      }else{
        const p=document.createElement("p");
        p.className="missing";
        p.textContent="教材はまだありません";
        detail.append(p);
      }
      article.append(detail);
    }
    container.append(article);
  }
  empty.hidden=visible!==0;
  statusText.textContent=allMaterials.length+" 件のPDF教材を登録中"+(terms.length?" · 検索結果 "+data.length+" 件":"");
}
async function init(){
  try{
    const response=await fetch("./materials.json",{cache:"no-cache"});
    if(!response.ok) throw new Error("HTTP "+response.status);
    const result=await response.json();
    if(!Array.isArray(result)) throw new Error("教材データの形式が不正です");
    allMaterials=result.filter(valid).sort((a,b)=>a.title.localeCompare(b.title,"ja"));
    render();
  }catch(error){
    statusText.textContent="教材一覧を読み込めませんでした。再読み込みしてください。";
    console.error("教材一覧の取得に失敗:",error);
  }
}
search.addEventListener("input",render);
document.querySelector("nav").addEventListener("click",()=>{
  if(search.value){search.value="";render();}
});
init();
</script>
</body>
