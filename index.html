<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>大学入試 PDF教材ライブラリ</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#101827;color:#e9eef7;

font-family:system-ui,sans-serif}

header{padding:35px 6%;background:#192439}

h1{margin:0 0 10px}

header p{color:#a9b9d0}

main{max-width:1100px;margin:auto;padding:30px 20px}

nav{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:25px}

button{background:#28364d;color:white;border:1px solid #465571;

border-radius:9px;padding:12px 20px;cursor:pointer}

button.active,button:hover{background:#4168a5}

input{width:100%;padding:14px;margin-bottom:25px;

background:#1c293d;border:1px solid #485771;

border-radius:9px;color:white;font-size:16px}

#materials{display:grid;grid-template-columns:

repeat(auto-fit,minmax(250px,1fr));gap:16px}

article{background:#1d2a3d;padding:22px;border-radius:12px}

article h2{font-size:18px;margin-top:0}

article p{color:#aebdd0}

a{color:#a9ccff}

</style>

</head>

<body>

<header>

<h1>大学入試 PDF教材ライブラリ</h1>

<p>共通テスト・難関大学入試対策</p>

</header>

<main>

<nav id="categories"></nav>

<input id="search" placeholder="教材を検索">

<section id="materials"></section>
