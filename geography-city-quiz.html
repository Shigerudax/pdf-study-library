<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>地理｜地図から都市名を当てるWebクイズ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRcAE3nI0Nx5JZM5prRMPyYJ4=" crossorigin="">
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:#eaf2fd;font:16px/1.6 system-ui,-apple-system,"Yu Gothic",sans-serif}
main{max-width:1010px;margin:auto;padding:18px 16px 55px}
a{color:#b5d6ff}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
header a{text-decoration:none}
h1{font-size:clamp(24px,4vw,34px);margin:14px 0 4px}
.description{color:#c3d1e3;margin:0 0 19px}
.panel{border:1px solid #526e90;border-radius:15px;background:#1b2c43;padding:clamp(14px,3vw,24px);margin-top:16px}
h2{margin:0 0 12px;font-size:21px}
.select-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
select,button{font:inherit;border-radius:9px}
select{background:#293c58;color:white;padding:10px 14px;border:1px solid #86a5c7;max-width:100%}
button{cursor:pointer}
.primary{background:#d0e7ff;color:#102941;padding:11px 20px;font-weight:750;border:0}
.secondary{background:#2f4967;color:#eff6ff;padding:11px 19px;border:1px solid #809cbc}
button:disabled{opacity:.7;cursor:default}
.hidden{display:none!important}
#map{height:clamp(290px,48vw,510px);background:#d8e4ea;border-radius:12px;overflow:hidden;z-index:0;border:1px solid #b7c8d7}
#progress{margin:0 0 10px;color:#cbdaf0;font-weight:650}
.bar{height:8px;background:#364b68;overflow:hidden;border-radius:10px;margin:0 0 15px}.bar div{height:100%;width:0;background:#8ccaff;transition:width .2s}
.question{margin:15px 0;font-size:clamp(18px,3vw,23px);font-weight:750}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.choice{padding:14px 12px;border:1px solid #738eaf;background:#263e5c;color:white;text-align:left;min-height:54px}
.choice:hover:not(:disabled){background:#365677}
.choice.correct{background:#174f3b;border:2px solid #7fdba3;color:white;opacity:1}
.choice.wrong{background:#65343a;border:2px solid #fa9b9b;opacity:1}
.feedback{margin-top:12px;padding:13px 16px;border-radius:9px;background:#10233b;line-height:1.8}
.marker-dot{width:18px;height:18px;background:#ff4141;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 3px #be2b2b,0 1px 8px #0009}
#bottom{margin-top:14px}
.note{font-size:13px;color:#c2d2e8;margin-top:10px}
.score{font-size:clamp(28px,5vw,42px);font-weight:800;margin:12px 0}
.leaflet-container{font-family:inherit}
.leaflet-control-attribution{font-size:10px!important}
button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #c9e7ff;outline-offset:3px}
@media(max-width:580px){.answers{grid-template-columns:1fr}#map{height:340px}}
@media(prefers-reduced-motion:reduce){.bar div{transition:none}}
</style>
</head>
<body>
<main>
<header><a href="web-practice.html">← Web演習の科目一覧</a><a href="index.html">トップページ</a></header>
<h1>地図から都市名を当てるクイズ</h1>
<p class="description">赤い地点がどの都市かを4択で答えます。都市名のない衛星地図から、海岸線・地形・位置関係を読み取りましょう。</p>
<section class="panel" id="setup">
<h2>出題地域を選択</h2>
<div class="select-row"><label for="region">地域</label><select id="region"><option value="all">全地域（60都市）</option></select><button id="start" class="primary">クイズ開始</button></div>
<p class="note">地域別は10問、全地域は60問です。出題順と選択肢の配置は毎回変わります。地図の拡大・縮小・移動が可能です。</p>
</section>
<section class="panel hidden" id="quiz">
<p id="progress"></p><div class="bar" aria-hidden="true"><div id="bar"></div></div>
<div id="map" role="img" aria-label="都市名のない衛星地図。赤い点が問題の都市の位置です"></div>
<p id="question" class="question">赤い地点に位置する都市はどれですか？</p>
<div id="answers" class="answers"></div>
<div id="feedback" class="feedback hidden" role="status" aria-live="polite"></div>
<div id="bottom"><button id="next" class="primary hidden">次の問題へ</button> <button id="reset" class="secondary">地域選択へ戻る</button></div>
<p class="note">地図：© Esriほか。都市名を表示しない衛星地図を利用しています。オンライン接続が必要です。</p>
</section>
<section class="panel hidden" id="result" aria-live="polite">
<h2>演習結果</h2><p id="score" class="score"></p><p id="result-note"></p><button id="again" class="primary">もう一度挑戦</button> <button id="return" class="secondary">地域を選び直す</button>
</section>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const REGIONS=[{"region":"東アジア","cities":[{"name":"東京","country":"日本","lat":35.6762,"lng":139.6503},{"name":"大阪","country":"日本","lat":34.6937,"lng":135.5023},{"name":"札幌","country":"日本","lat":43.0618,"lng":141.3545},{"name":"ソウル","country":"韓国","lat":37.5665,"lng":126.978},{"name":"北京","country":"中国","lat":39.9042,"lng":116.4074},{"name":"上海","country":"中国","lat":31.2304,"lng":121.4737},{"name":"広州","country":"中国","lat":23.1291,"lng":113.2644},{"name":"台北","country":"台湾","lat":25.033,"lng":121.5654},{"name":"香港","country":"中国","lat":22.3193,"lng":114.1694},{"name":"ウランバートル","country":"モンゴル","lat":47.9212,"lng":106.9186}]},{"region":"東南・南アジア","cities":[{"name":"バンコク","country":"タイ","lat":13.7563,"lng":100.5018},{"name":"ハノイ","country":"ベトナム","lat":21.0278,"lng":105.8342},{"name":"ホーチミン","country":"ベトナム","lat":10.8231,"lng":106.6297},{"name":"プノンペン","country":"カンボジア","lat":11.5564,"lng":104.9282},{"name":"クアラルンプール","country":"マレーシア","lat":3.139,"lng":101.6869},{"name":"シンガポール","country":"シンガポール","lat":1.3521,"lng":103.8198},{"name":"ジャカルタ","country":"インドネシア","lat":-6.2088,"lng":106.8456},{"name":"マニラ","country":"フィリピン","lat":14.5995,"lng":120.9842},{"name":"ニューデリー","country":"インド","lat":28.6139,"lng":77.209},{"name":"ムンバイ","country":"インド","lat":19.076,"lng":72.8777}]},{"region":"ヨーロッパ","cities":[{"name":"ロンドン","country":"イギリス","lat":51.5072,"lng":-0.1276},{"name":"パリ","country":"フランス","lat":48.8566,"lng":2.3522},{"name":"ベルリン","country":"ドイツ","lat":52.52,"lng":13.405},{"name":"ローマ","country":"イタリア","lat":41.9028,"lng":12.4964},{"name":"マドリード","country":"スペイン","lat":40.4168,"lng":-3.7038},{"name":"リスボン","country":"ポルトガル","lat":38.7223,"lng":-9.1393},{"name":"アムステルダム","country":"オランダ","lat":52.3676,"lng":4.9041},{"name":"ウィーン","country":"オーストリア","lat":48.2082,"lng":16.3738},{"name":"ワルシャワ","country":"ポーランド","lat":52.2297,"lng":21.0122},{"name":"ストックホルム","country":"スウェーデン","lat":59.3293,"lng":18.0686}]},{"region":"中東・アフリカ","cities":[{"name":"イスタンブール","country":"トルコ","lat":41.0082,"lng":28.9784},{"name":"カイロ","country":"エジプト","lat":30.0444,"lng":31.2357},{"name":"アレクサンドリア","country":"エジプト","lat":31.2001,"lng":29.9187},{"name":"ラゴス","country":"ナイジェリア","lat":6.5244,"lng":3.3792},{"name":"アブジャ","country":"ナイジェリア","lat":9.0765,"lng":7.3986},{"name":"ナイロビ","country":"ケニア","lat":-1.2921,"lng":36.8219},{"name":"アディスアベバ","country":"エチオピア","lat":9.03,"lng":38.74},{"name":"ヨハネスブルグ","country":"南アフリカ","lat":-26.2041,"lng":28.0473},{"name":"ケープタウン","country":"南アフリカ","lat":-33.9249,"lng":18.4241},{"name":"ドバイ","country":"アラブ首長国連邦","lat":25.2048,"lng":55.2708}]},{"region":"北アメリカ","cities":[{"name":"ニューヨーク","country":"アメリカ","lat":40.7128,"lng":-74.006},{"name":"ワシントンD.C.","country":"アメリカ","lat":38.9072,"lng":-77.0369},{"name":"ボストン","country":"アメリカ","lat":42.3601,"lng":-71.0589},{"name":"シカゴ","country":"アメリカ","lat":41.8781,"lng":-87.6298},{"name":"デトロイト","country":"アメリカ","lat":42.3314,"lng":-83.0458},{"name":"ロサンゼルス","country":"アメリカ","lat":34.0522,"lng":-118.2437},{"name":"サンフランシスコ","country":"アメリカ","lat":37.7749,"lng":-122.4194},{"name":"シアトル","country":"アメリカ","lat":47.6062,"lng":-122.3321},{"name":"トロント","country":"カナダ","lat":43.6532,"lng":-79.3832},{"name":"メキシコシティ","country":"メキシコ","lat":19.4326,"lng":-99.1332}]},{"region":"南アメリカ・オセアニア","cities":[{"name":"リオデジャネイロ","country":"ブラジル","lat":-22.9068,"lng":-43.1729},{"name":"サンパウロ","country":"ブラジル","lat":-23.5505,"lng":-46.6333},{"name":"ブラジリア","country":"ブラジル","lat":-15.7939,"lng":-47.8828},{"name":"ブエノスアイレス","country":"アルゼンチン","lat":-34.6037,"lng":-58.3816},{"name":"サンティアゴ","country":"チリ","lat":-33.4489,"lng":-70.6693},{"name":"リマ","country":"ペルー","lat":-12.0464,"lng":-77.0428},{"name":"ボゴタ","country":"コロンビア","lat":4.711,"lng":-74.0721},{"name":"シドニー","country":"オーストラリア","lat":-33.8688,"lng":151.2093},{"name":"メルボルン","country":"オーストラリア","lat":-37.8136,"lng":144.9631},{"name":"オークランド","country":"ニュージーランド","lat":-36.8485,"lng":174.7633}]}];
const $=id=>document.getElementById(id);
const all=REGIONS.flatMap(g=>g.cities.map(c=>({...c,region:g.region})));
const randomize=a=>{const out=a.slice();for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out};
REGIONS.forEach((g,i)=>{const o=document.createElement("option");o.value=String(i);o.textContent=g.region+"（10問）";$("region").append(o)});
let questions=[],at=0,points=0,answered=false,map=null,marker=null,previousRegion="all";
function initMap(){
  if(map)return;
  if(typeof L==="undefined"){$("feedback").textContent="地図ライブラリを読み込めませんでした。ネットワーク接続を確認し、再読み込みしてください。";$("feedback").classList.remove("hidden");return}
  map=L.map("map",{zoomControl:true,attributionControl:true,worldCopyJump:true, minZoom:2,maxZoom:10});
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{
    attribution:'Tiles &copy; Esri, Maxar, Earthstar Geographics, and the GIS User Community',
    maxZoom:19, crossOrigin:true
  }).addTo(map);
  marker=L.marker([0,0],{icon:L.divIcon({className:"",html:'<div class="marker-dot"></div>',iconSize:[22,22],iconAnchor:[11,11]}),keyboard:false}).addTo(map);
}
function start(){
  previousRegion=$("region").value;
  const pool=previousRegion==="all"?all:REGIONS[Number(previousRegion)].cities.map(c=>({...c,region:REGIONS[Number(previousRegion)].region}));
  questions=randomize(pool);at=0;points=0;
  $("setup").classList.add("hidden");$("result").classList.add("hidden");$("quiz").classList.remove("hidden");
  initMap();if(map)setTimeout(()=>map.invalidateSize(),0);showQuestion();
}
function candidateChoices(target){
  const nearby=all.filter(c=>c.name!==target.name&&c.region===target.region);
  // 同じ地域・同種の都市名を優先して無関係な選択肢を排除
  const distractors=randomize(nearby).slice(0,3).map(c=>c.name);
  return randomize([target.name,...distractors]);
}
function showQuestion(){
  answered=false;
  const city=questions[at];$("progress").textContent=city.region+"｜第"+(at+1)+"問 / 全"+questions.length+"問　正解 "+points+"問";
  $("bar").style.width=(at/questions.length*100)+"%";
  $("question").textContent="赤い地点に位置する都市はどれですか？";
  $("feedback").classList.add("hidden");$("next").classList.add("hidden");
  const parent=$("answers");parent.replaceChildren();
  for(const name of candidateChoices(city)){
    const btn=document.createElement("button");btn.type="button";btn.className="choice";btn.textContent=name;
    btn.addEventListener("click",()=>choose(name,btn));parent.append(btn);
  }
  if(map){
    map.invalidateSize();
    const lat=city.lat,lng=city.lng;
    const zoom=city.region==="東アジア"||city.region==="ヨーロッパ"?5:city.region==="東南・南アジア"?5:4;
    map.setView([lat,lng],zoom,{animate:false});
    marker.setLatLng([lat,lng]);
  }
}
function choose(name,button){
  if(answered)return;
  answered=true;const city=questions[at];const correct=name===city.name;
  if(correct)points++;
  for(const b of $("answers").children){
    b.disabled=true;
    if(b.textContent===city.name)b.classList.add("correct");
    else if(b===button)b.classList.add("wrong");
  }
  $("progress").textContent=city.region+"｜第"+(at+1)+"問 / 全"+questions.length+"問　正解 "+points+"問";
  $("feedback").textContent=(correct?"正解！":"不正解。")+" 正しくは「"+city.name+"」（"+city.country+"）です。";
  $("feedback").classList.remove("hidden");
  $("next").textContent=at===questions.length-1?"結果を見る":"次の問題へ";
  $("next").classList.remove("hidden");
}
function next(){
  if(!answered)return;
  at++;
  if(at<questions.length){showQuestion();return}
  $("quiz").classList.add("hidden");$("result").classList.remove("hidden");
  $("score").textContent=points+" / "+questions.length+"問 正解";
  $("result-note").textContent="正答率："+Math.round(points/questions.length*100)+"%。都市の位置をもう一度地図上で確認すると、定着しやすくなります。";
  $("result").scrollIntoView({behavior:"smooth",block:"start"});
}
function back(){$("quiz").classList.add("hidden");$("result").classList.add("hidden");$("setup").classList.remove("hidden");$("setup").scrollIntoView({behavior:"smooth",block:"start"})}
$("start").addEventListener("click",start);
$("next").addEventListener("click",next);
$("reset").addEventListener("click",back);
$("return").addEventListener("click",back);
$("again").addEventListener("click",()=>{$("region").value=previousRegion;start()});
</script>
</body>
</html>
