<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>地理｜地図から都市名を当てるWebクイズ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRcAE3nI0Nx5JZM5prRMPyYJ4=" crossorigin="">
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:#eaf2fd;font:16px/1.6 system-ui,-apple-system,"Yu Gothic",sans-serif}
main{max-width:1010px;margin:auto;padding:18px 16px 55px}
a{color:#b5d6ff}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
header a{text-decoration:none}
h1{font-size:clamp(24px,4vw,34px);margin:14px 0 4px}
.description{color:#c3d1e3;margin:0 0 19px}
.panel{border:1px solid #526e90;border-radius:15px;background:#1b2c43;padding:clamp(14px,3vw,24px);margin-top:16px}
h2{margin:0 0 12px;font-size:21px}
.select-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
select,button{font:inherit;border-radius:9px}
select{background:#293c58;color:white;padding:10px 14px;border:1px solid #86a5c7;max-width:100%}
button{cursor:pointer}
.primary{background:#d0e7ff;color:#102941;padding:11px 20px;font-weight:750;border:0}
.secondary{background:#2f4967;color:#eff6ff;padding:11px 19px;border:1px solid #809cbc}
button:disabled{opacity:.7;cursor:default}
.hidden{display:none!important}
#map{height:clamp(290px,48vw,510px);background:#d8e4ea;border-radius:12px;overflow:hidden;z-index:0;border:1px solid #b7c8d7}
#progress{margin:0 0 10px;color:#cbdaf0;font-weight:650}
.bar{height:8px;background:#364b68;overflow:hidden;border-radius:10px;margin:0 0 15px}.bar div{height:100%;width:0;background:#8ccaff;transition:width .2s}
.question{margin:15px 0;font-size:clamp(18px,3vw,23px);font-weight:750}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.choice{padding:14px 12px;border:1px solid #738eaf;background:#263e5c;color:white;text-align:left;min-height:54px}
.choice:hover:not(:disabled){background:#365677}
.choice.correct{background:#174f3b;border:2px solid #7fdba3;color:white;opacity:1}
.choice.wrong{background:#65343a;border:2px solid #fa9b9b;opacity:1}
.feedback{white-space:pre-line;margin-top:12px;padding:13px 16px;border-radius:9px;background:#10233b;line-height:1.8}
.marker-dot{width:18px;height:18px;background:#ff4141;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 3px #be2b2b,0 1px 8px #0009}
#bottom{margin-top:14px}
.note{font-size:13px;color:#c2d2e8;margin-top:10px}
.score{font-size:clamp(28px,5vw,42px);font-weight:800;margin:12px 0}
.leaflet-container{font-family:inherit}
.leaflet-control-attribution{font-size:10px!important}
button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #c9e7ff;outline-offset:3px}
@media(max-width:580px){.answers{grid-template-columns:1fr}#map{height:340px}}
@media(prefers-reduced-motion:reduce){.bar div{transition:none}}
</style>
</head>
<body>
<main>
<header><a href="web-practice.html">← Web演習の科目一覧</a><a href="index.html">トップページ</a></header>
<h1>地図から都市名を当てるクイズ</h1>
<p class="description">赤い地点がどの都市かを4択で答えます。都市名のない衛星地図から、海岸線・地形・位置関係を読み取りましょう。</p>
<section class="panel" id="setup">
<h2>出題地域を選択</h2>
<div class="select-row"><label for="region">地域</label><select id="region"><option value="all">全地域（60都市）</option></select><label for="city-count">出題数</label><select id="city-presets"></select><input id="city-count" required type="number" min="1" step="1" inputmode="numeric" style="width:85px;padding:10px;font:inherit" aria-label="任意の出題数"> 問 <label for="city-order">出題順</label><select id="city-order"><option value="random">ランダム</option><option value="ordered">登録順</option></select><button id="start" class="primary">クイズ開始</button></div>
<p class="note">地域別は最大10問、全地域は最大60問です。出題数を自由に指定できます。選択肢の配置は毎回変わります。地図の拡大・縮小・移動が可能です。</p>
</section>
<section class="panel hidden" id="quiz">
<p id="progress"></p><div class="bar" aria-hidden="true"><div id="bar"></div></div>
<div id="map" role="img" aria-label="都市名のない衛星地図。赤い点が問題の都市の位置です"></div>
<div id="map-status" class="note" role="status" aria-live="polite"></div><button id="map-retry" class="secondary hidden" type="button">地図を再読み込み</button><p id="question" class="question">赤い地点に位置する都市はどれですか？</p>
<div id="answers" class="answers"></div>
<div id="feedback" class="feedback hidden" role="status" aria-live="polite"></div>
<div id="bottom"><button id="next" class="primary hidden">次の問題へ</button> <button id="reset" class="secondary">地域選択へ戻る</button></div>
<p class="note">地図：© Esriほか。都市名を表示しない衛星地図を利用しています。オンライン接続が必要です。</p>
</section>
<section class="panel hidden" id="result" aria-live="polite">
<h2>演習結果</h2><p id="score" class="score"></p><p id="result-note"></p><div id="city-result-detail"></div><button id="again" class="primary">同じ問題をもう一度</button> <button id="city-review" class="secondary">誤答だけ再演習</button> <button id="return" class="secondary">地域を選び直す</button>
</section>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="data/quizzes/geography-city-quiz.js"></script><script src="assets/js/geography-city-quiz.js"></script>
</body>
</html>
