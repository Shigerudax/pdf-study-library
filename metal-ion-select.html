<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>金属イオン 全選択40問</title><style>

.token{min-width:76px;text-align:center}.answer-area{min-height:84px}</style></head><body><main><nav><a href="web-practice.html">← Web演習一覧</a></nav><h1>金属イオン・反応判定40問</h1><p class="muted">各イオンの単独水溶液を通常の高校化学の定性分析条件で扱う。混合液は明記する。濃度・pHによる例外は除く。</p><section id="setup" class="panel"><h2>演習設定</h2><label>範囲 <select id="group"><option value="-1">全範囲</option><option value="0">沈殿・色</option><option value="1">再溶解・錯イオン</option><option value="2">系統分離</option><option value="3">呈色・検出</option></select></label><p><label>出題数 <input id="count" type="number" min="1" max="40" value="20"></label></p><div class="row" id="presets"></div><button class="primary" id="start">演習開始</button> <button id="resume" hidden>中断から再開</button></section><section id="quiz" class="panel hidden"><p id="progress"></p><div class="bar"><div id="bar"></div></div><p id="q" class="sentence"></p><p class="muted">該当するイオンをすべてタップ。選択順は不問。</p><div id="answer" class="tokens answer-area"></div><div id="pool" class="tokens"></div><div class="row"><button class="primary" id="submit">解答する</button><button id="undo">一つ戻す</button><button id="clear">選び直す</button></div><div id="feedback" class="feedback hidden" role="status"></div><div class="row"><button class="primary" id="next" hidden>次へ</button><button id="pause">中断して設定へ</button></div></section><section id="result" class="panel hidden"><h2 id="score"></h2><div id="mistakes"></div><button id="retry">誤答のみ再演習</button> <button id="home">設定へ</button></section></main><script src="data/quizzes/metal-ion-select.js"></script><script src="assets/js/metal-ion-select.js"></script></body></html>
