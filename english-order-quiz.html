</style></head><body><main><nav><a href="web-practice.html">← Web演習一覧</a>　<a href="index.html">トップページ</a></nav><h1>英語｜英文整序100問</h1><p class="muted">日本語の意味に合うように、語句をタップして英文を完成させましょう。5レベル・各20問。すべて解説付き。</p>
<section id="setup" class="panel"><h2>演習設定</h2><div id="resume"></div><div id="levels" class="levels"></div><p><label for="count">出題数 <input id="count" type="number" required min="1" max="100" value="20" step="1" inputmode="numeric"> 問</label></p><div id="presets" class="row"></div><label>出題順 <select id="order"><option value="random">ランダム</option><option value="ordered">登録順</option></select></label><p id="error" role="alert"></p><div class="row"><button id="start" class="primary" disabled>演習開始</button><button id="review-all" disabled>誤答を復習</button></div><p id="stats" class="note">演習データを読み込み中…</p><noscript>JavaScriptを有効にしてください。</noscript></section>
<section id="quiz" class="panel hidden"><p id="progress" class="muted"></p><div class="bar"><div id="bar"></div></div><p id="jp" class="sentence" tabindex="-1"></p><p class="muted">語句を順番にタップしてください。選んだ語句は再タップで取り消せます。I・固有名詞などを除き小文字で表示し、文末の句読点は省略しています。</p><div id="answer" class="tokens answer-area" aria-label="解答欄"></div><div id="pool" class="tokens" aria-label="選択する語句"></div><div class="row"><button id="submit" class="primary" disabled>解答する</button><button id="undo">一つ戻す</button><button id="clear">並べ直す</button></div><div id="feedback" class="feedback hidden" role="status"></div><div class="row"><button id="next" class="primary hidden">次の問題へ</button><button id="pause">中断して設定へ</button></div></section>
<section id="result" class="panel hidden"><h2>演習結果</h2><p id="score" tabindex="-1"></p><p id="breakdown"></p><details id="mistakes-fold"><summary id="mistakes-title">誤答一覧</summary><ol id="mistakes"></ol></details><div class="row"><button id="again" class="primary">同じ問題をもう一度</button><button id="retry">誤答だけ再演習</button><button id="home">設定に戻る</button></div></section></main>
<script>
(function(){"use strict";try{
const groups=[{"level":"基礎","items":[{"id":"1-1","jp":"私は毎朝6時に起きます。","tokens":["I","get up","at six","every morning."],"ex":"get up は「起きる」。時刻には at を使う。"},{"id":"1-2","jp":"彼女は放課後にテニスをします。","tokens":["She","plays","tennis","after school."],"ex":"三人称単数の主語なので plays。"},{"id":"1-3","jp":"この本は私のものです。","tokens":["This book","is","mine."],"ex":"mine は所有代名詞で、my book に相当する。"},{"id":"1-4","jp":"あなたは昨日何を買いましたか。","tokens":["What","did","you","buy","yesterday?"],"ex":"疑問詞＋did＋主語＋動詞の原形。"},{"id":"1-5","jp":"私は今、夕食を作っています。","tokens":["I","am","cooking","dinner","now."],"ex":"現在進行形は be＋動詞の ing 形。"},{"id":"1-6","jp":"机の上にリンゴが3個あります。","tokens":["There","are","three apples","on the desk."],"ex":"複数の名詞には There are を用いる。"},{"id":"1-7","jp":"彼は泳ぐことができません。","tokens":["He","cannot","swim."],"ex":"助動詞の後は動詞の原形。"},{"id":"1-8","jp":"窓を開けてください。","tokens":["Please","open","the window."],"ex":"命令文は動詞の原形から始める。"},{"id":"1-9","jp":"彼らは先週京都を訪れました。","tokens":["They","visited","Kyoto","last week."],"ex":"過去の時点を示す last week。"},{"id":"1-10","jp":"私はその映画を見たいです。","tokens":["I","want","to see","the movie."],"ex":"want to do は「〜したい」。"},{"id":"1-11","jp":"彼女は英語を話すのが得意です。","tokens":["She","is good at","speaking","English."],"ex":"前置詞 at の後は動名詞。"},{"id":"1-12","jp":"あなたのお兄さんは何歳ですか。","tokens":["How old","is","your brother?"],"ex":"How old＋be動詞＋主語。"},{"id":"1-13","jp":"明日は雨が降るでしょう。","tokens":["It","will","rain","tomorrow."],"ex":"天候の it と未来を表す will。"},{"id":"1-14","jp":"私は彼に手紙を送りました。","tokens":["I","sent","him","a letter."],"ex":"send＋人＋物の語順。"},{"id":"1-15","jp":"この花はとてもよい香りがします。","tokens":["This flower","smells","very nice."],"ex":"感覚を表す動詞 smell の後は形容詞。"},{"id":"1-16","jp":"彼は昨日学校に行きませんでした。","tokens":["He","did not","go","to school","yesterday."],"ex":"did not の後は原形。"},{"id":"1-17","jp":"どちらの色が好きですか。","tokens":["Which color","do","you","like?"],"ex":"which＋名詞を疑問詞として文頭に置く。"},{"id":"1-18","jp":"私の母は私より早く起きます。","tokens":["My mother","gets up","earlier","than I do."],"ex":"比較級＋than。"},{"id":"1-19","jp":"ここで写真を撮ってもいいですか。","tokens":["May","I","take","a picture","here?"],"ex":"May I ...? は許可を求める表現。"},{"id":"1-20","jp":"その知らせは私たちを幸せにしました。","tokens":["The news","made","us","happy."],"ex":"make＋目的語＋形容詞の第5文型。"}]},{"level":"基本","items":[{"id":"2-1","jp":"私はこの町に3年間住んでいます。","tokens":["I","have lived","in","this town","for","three years."],"ex":"現在完了の継続用法。期間には for。"},{"id":"2-2","jp":"その橋は100年前に建てられました。","tokens":["The bridge","was","built","a hundred","years ago."],"ex":"受動態は be＋過去分詞。"},{"id":"2-3","jp":"何か飲むものをください。","tokens":["Please","give me","something","to","drink."],"ex":"不定詞が something を後ろから修飾する。"},{"id":"2-4","jp":"私は早く起きることに慣れています。","tokens":["I","am used","to","getting up","early."],"ex":"be used to の to は前置詞。"},{"id":"2-5","jp":"彼は忙しすぎて私を手伝えません。","tokens":["He","is","too busy","to","help me."],"ex":"too ... to do は「〜すぎて…できない」。"},{"id":"2-6","jp":"この問題は私が解けるほど簡単です。","tokens":["This problem","is","easy enough","for me","to solve."],"ex":"enough は形容詞の後、for me は不定詞の意味上の主語。"},{"id":"2-7","jp":"彼女は私に静かにするように頼みました。","tokens":["She","asked","me","to","be quiet."],"ex":"ask＋人＋to do。"},{"id":"2-8","jp":"私は何をすべきか分かりません。","tokens":["I","do not","know","what","to do."],"ex":"疑問詞＋不定詞。"},{"id":"2-9","jp":"彼は医者になるために一生懸命勉強した。","tokens":["He","studied","hard","to become","a doctor."],"ex":"目的を表す不定詞。"},{"id":"2-10","jp":"これは父が私にくれた時計です。","tokens":["This","is the watch","that","my father","gave me."],"ex":"関係代名詞 that が watch を修飾する。"},{"id":"2-11","jp":"あそこで走っている少年は私の弟です。","tokens":["The boy","running","over there","is","my brother."],"ex":"現在分詞による名詞の後置修飾。"},{"id":"2-12","jp":"英語は世界中で話されています。","tokens":["English","is","spoken","all over","the world."],"ex":"受動態と all over the world。"},{"id":"2-13","jp":"私は彼女が来るかどうか知りません。","tokens":["I","do not know","whether","she","will come."],"ex":"whether 節が know の目的語。"},{"id":"2-14","jp":"彼は私よりも背が高くありません。","tokens":["He","is not","as tall","as","I am."],"ex":"not as ... as は比較対象ほど〜でない。"},{"id":"2-15","jp":"その知らせを聞いて私は驚きました。","tokens":["I","was surprised","to","hear","the news."],"ex":"感情の原因を表す不定詞。"},{"id":"2-16","jp":"宿題を終えたら遊びに行ってもよい。","tokens":["You may","go out to play","after","you","finish your homework."],"ex":"時を表す副詞節は未来の内容でも現在形。"},{"id":"2-17","jp":"私は彼にその箱を運んでもらいました。","tokens":["I","had","him","carry","the box."],"ex":"使役動詞 have＋人＋原形。"},{"id":"2-18","jp":"彼女は歌うだけでなく踊ることもできます。","tokens":["She can","not only","sing","but also","dance."],"ex":"not only A but also B。"},{"id":"2-19","jp":"この部屋を掃除する必要があります。","tokens":["This","room","needs","cleaning."],"ex":"need＋動名詞は受動的な意味を表せる。"},{"id":"2-20","jp":"彼は何も言わずに部屋を出ました。","tokens":["He","left","the room","without","saying anything."],"ex":"without は前置詞なので動名詞を続ける。"}]},{"level":"標準","items":[{"id":"3-1","jp":"もっと時間があれば、その本を読めるのに。","tokens":["If I","had","more time,","I","could read","the book."],"ex":"仮定法過去。現在の事実に反する仮定。"},{"id":"3-2","jp":"あなたの助けがなければ、私は成功できなかったでしょう。","tokens":["Without","your help,","I","could not","have","succeeded."],"ex":"仮定法過去完了の帰結。without が条件を表す。"},{"id":"3-3","jp":"彼がなぜそんなことをしたのか私には分からない。","tokens":["I","cannot","understand","why","he did","such a thing."],"ex":"間接疑問文では疑問詞の後は平叙文の語順。"},{"id":"3-4","jp":"彼女はその知らせに驚いたようだった。","tokens":["She","seemed","to be","surprised","at the news."],"ex":"seem to do と be surprised at。"},{"id":"3-5","jp":"その問題は最初に思ったほど難しくなかった。","tokens":["The problem","was not","as difficult","as","I had","first thought."],"ex":"not as ... as と過去完了。"},{"id":"3-6","jp":"私が一番心配しているのは彼の健康です。","tokens":["What","worries me","most","is","his health."],"ex":"関係代名詞 what の節を主語とする。"},{"id":"3-7","jp":"彼は私にどこで切符を買えばよいか教えてくれた。","tokens":["He","told","me","where","to buy","the tickets."],"ex":"tell＋人＋疑問詞＋不定詞。"},{"id":"3-8","jp":"この本は読む価値が十分にある。","tokens":["This book","is","well","worth","reading."],"ex":"be worth doing。"},{"id":"3-9","jp":"私は彼が通りを渡るのを見た。","tokens":["I","saw","him","cross","the street."],"ex":"知覚動詞＋目的語＋原形は動作全体を知覚する。"},{"id":"3-10","jp":"彼はまるで何も起こらなかったかのように話した。","tokens":["He","talked","as if","nothing","had happened."],"ex":"as if＋過去完了で過去の反事実を表す。"},{"id":"3-11","jp":"この機械は使い方が難しい。","tokens":["This machine","is","difficult","to","use."],"ex":"形容詞＋不定詞。machine は use の意味上の目的語。"},{"id":"3-12","jp":"彼が会議に出席することは重要だ。","tokens":["It is","important","that","he","should attend","the meeting."],"ex":"形式主語 it。要求・重要性を表す that 節。"},{"id":"3-13","jp":"もう出発する時間だ。","tokens":["It","is","time","we","left."],"ex":"It is time＋主語＋過去形。"},{"id":"3-14","jp":"彼女は私が期待していた以上にうまくやった。","tokens":["She","did","better","than","I had expected."],"ex":"比較級と than 節。"},{"id":"3-15","jp":"どんなに忙しくても、彼は毎日運動する。","tokens":["However","busy","he may be,","he","exercises","every day."],"ex":"however＋形容詞＋主語＋動詞。"},{"id":"3-16","jp":"その公園は以前の姿とは違っている。","tokens":["The park","is","different","from","what","it used to be."],"ex":"what 節と used to be。"},{"id":"3-17","jp":"彼はその事故について何も知らないと主張した。","tokens":["He","claimed","to know","nothing","about","the accident."],"ex":"claim to do は「〜だと主張する」。"},{"id":"3-18","jp":"時間がたつにつれて、彼女の不安は消えていった。","tokens":["As","time went by,","her","anxiety","disappeared."],"ex":"as は「〜するにつれて」。"},{"id":"3-19","jp":"その小説を読んで初めて、その題名の意味が分かった。","tokens":["It was","not until","I read the novel","that","I understood","its title."],"ex":"It was not until ... that の強調構文。"},{"id":"3-20","jp":"彼が遅れたのは交通渋滞のためだった。","tokens":["The reason","why","he was late","was","that","he was caught in traffic."],"ex":"The reason why ... is that ... の構文。"}]},{"level":"応用","items":[{"id":"4-1","jp":"彼は自分の決断を後悔しているように見える。","tokens":["He","seems","to","regret","his decision."],"ex":"seem to do は「〜するように見える」。regret は「後悔する」。"},{"id":"4-2","jp":"その研究が成功するかどうかは資金次第である。","tokens":["Whether","the research","will succeed","depends","on","funding."],"ex":"whether 節が主語。depend on は「〜次第である」。"},{"id":"4-3","jp":"彼女の成功は才能というより努力によるものだった。","tokens":["Her success","was due","not so much","to talent","as","to hard work."],"ex":"not so much A as B は「AというよりB」。"},{"id":"4-4","jp":"私たちは自然を当然のものと考えるべきではない。","tokens":["We","should not","take","nature","for","granted."],"ex":"take A for granted は「Aを当然と考える」。"},{"id":"4-5","jp":"彼の説明が明確だったので、私は問題を理解できた。","tokens":["His clear explanation","enabled","me","to","understand","the problem."],"ex":"enable＋人＋to do。"},{"id":"4-6","jp":"彼は自分の意見が誤っている可能性を認めなかった。","tokens":["He","refused","to admit","the possibility","that","his opinion","might be wrong."],"ex":"同格の that 節が possibility の内容を示す。"},{"id":"4-7","jp":"人口が増えるにつれて、住宅の需要も増加する。","tokens":["The more","the population","grows,","the greater","the demand","for housing","becomes."],"ex":"the 比較級 ... the 比較級 ... の相関構文。"},{"id":"4-8","jp":"彼が言ったことは必ずしも正しいとは限らない。","tokens":["What","he said","is","not","necessarily","true."],"ex":"not necessarily は部分否定。"},{"id":"4-9","jp":"このような困難にもかかわらず、彼らは計画を実行した。","tokens":["Despite","these","difficulties,","they","carried out","the plan."],"ex":"despite は前置詞。carry out は実行する。"},{"id":"4-10","jp":"彼女はその機会を逃したことを後悔している。","tokens":["She","regrets","having","missed","the opportunity."],"ex":"regret having done は過去の行為への後悔。"},{"id":"4-11","jp":"私は彼がその提案に反対する理由を理解できない。","tokens":["I cannot","see","why","he should","object","to","the proposal."],"ex":"object to は「〜に反対する」。should は意外性を表せる。"},{"id":"4-12","jp":"知識が多いからといって賢明であるとは限らない。","tokens":["Having","a lot of knowledge","does not necessarily","make","a person","wise."],"ex":"動名詞句を主語とし、make＋目的語＋形容詞。"},{"id":"4-13","jp":"彼がその事実を知っていたとは考えられない。","tokens":["He","cannot","have","known","the fact."],"ex":"cannot have done は過去への強い否定的推量。"},{"id":"4-14","jp":"私たちがどこに住むかはそれほど重要ではない。","tokens":["Where","we","live","does not","matter","very much."],"ex":"間接疑問節が主語。matter は重要である。"},{"id":"4-15","jp":"彼女が到着するやいなや会議が始まった。","tokens":["No sooner","had","she","arrived","than","the meeting","began."],"ex":"No sooner が文頭なので倒置が起こる。"},{"id":"4-16","jp":"彼は決して簡単に諦める人ではない。","tokens":["He is","the last","person","to","give up","easily."],"ex":"the last person to do は「最も〜しそうにない人」。"},{"id":"4-17","jp":"この情報が信頼できるかどうか確かめる必要がある。","tokens":["We need","to","find out","whether","this information","is reliable."],"ex":"find out の目的語となる whether 節。"},{"id":"4-18","jp":"彼女は私たちが知っている限り最も優秀な研究者の一人だ。","tokens":["She is","one of","the best researchers","that","we","know of."],"ex":"one of＋最上級＋複数名詞。"},{"id":"4-19","jp":"その提案は検討する価値があるように思われる。","tokens":["The proposal","appears","to","be","worth","considering."],"ex":"appear to do と be worth doing。"},{"id":"4-20","jp":"彼がどんなに一生懸命努力しても、その問題を解けなかった。","tokens":["No matter","how hard","he tried,","he","could not","solve","the problem."],"ex":"no matter how＋副詞＋主語＋動詞。"}]},{"level":"発展","items":[{"id":"5-1","jp":"その経験がなければ、私はその重要性を理解できなかっただろう。","tokens":["Had","it not","been","for that experience,","I would not","have understood","its importance."],"ex":"If it had not been for の if を省略した倒置。"},{"id":"5-2","jp":"彼がその重大さを悟ったのは、手遅れになってからだった。","tokens":["Only","when it was","too late","did","he realize","the seriousness","of the situation."],"ex":"Only＋副詞節を文頭に置くと主節が倒置する。"},{"id":"5-3","jp":"彼女がそんな誤りを犯すとは、夢にも思わなかった。","tokens":["Little","did","I","imagine","that she would","make","such a mistake."],"ex":"否定的な Little が文頭なので倒置。"},{"id":"5-4","jp":"彼は自分が正しいと確信していたが、その証拠はなかった。","tokens":["Convinced","as","he was","that he was right,","he","had","no evidence."],"ex":"形容詞＋as＋主語＋動詞で譲歩を表す。"},{"id":"5-5","jp":"彼の成功を疑う理由はまったくない。","tokens":["There","is","no reason","whatsoever","to doubt","his success."],"ex":"whatsoever は no reason を強調する。"},{"id":"5-6","jp":"人間の行動を理解するには、文化を考慮することが不可欠だ。","tokens":["To understand","human behavior,","it is","essential","to take","culture","into account."],"ex":"形式主語 it と take A into account。"},{"id":"5-7","jp":"証拠がないことは、その主張が誤りであることを必ずしも意味しない。","tokens":["The absence","of evidence","does not","necessarily mean","that","the claim","is false."],"ex":"部分否定と that 節。"},{"id":"5-8","jp":"その制度が意図した結果を生むとは限らない。","tokens":["The system","may not","produce","the results","it was","designed","to achieve."],"ex":"results を修飾する目的格関係代名詞の省略。"},{"id":"5-9","jp":"彼の議論には一見もっともらしいが、見落とせない欠陥がある。","tokens":["His argument,","plausible","though","it seems,","has","a flaw","that cannot be overlooked."],"ex":"形容詞＋though の譲歩と関係代名詞。"},{"id":"5-10","jp":"彼がそうしたのは名声を得るためではなく、真実を明らかにするためだった。","tokens":["It was","not to","gain fame","but to","reveal the truth","that","he did so."],"ex":"It is ... that の強調構文で目的を対比する。"},{"id":"5-11","jp":"その事実に気づいていれば、私たちは別の判断をしていたかもしれない。","tokens":["Had","we been","aware of the fact,","we","might","have made","a different decision."],"ex":"仮定法過去完了の if 省略。"},{"id":"5-12","jp":"私たちが当然とみなすものの多くは、歴史的な状況に左右される。","tokens":["Much","of what","we take","for granted","depends","on","historical circumstances."],"ex":"Much of what ... を主語とする構造。"},{"id":"5-13","jp":"彼女が意図したことと実際に達成したことの間には隔たりがある。","tokens":["There is","a gap","between","what she intended","and","what","she actually achieved."],"ex":"between A and B。2つの what 節を対比。"},{"id":"5-14","jp":"その問題は複雑すぎて、単一の要因で説明することはできない。","tokens":["The problem","is","too complex","to","be explained","by","a single factor."],"ex":"too ... to と受動不定詞。"},{"id":"5-15","jp":"彼の発言が持ちうる影響力を過小評価してはならない。","tokens":["The influence","that","his remarks","can have","must not","be","underestimated."],"ex":"influence を関係代名詞 that の節が修飾する。must not be underestimated は受動態。"},{"id":"5-16","jp":"研究者が直面しているのは、データ不足というより解釈の問題だ。","tokens":["What researchers","face","is not so much","a lack of data","as","a problem","of interpretation."],"ex":"what 節を主語にし、not so much A as B を用いる。"},{"id":"5-17","jp":"社会が変化するのに応じて、私たちの価値観も変わるのは当然だ。","tokens":["It is","only natural","that","our values","should change","as","society changes."],"ex":"形式主語 it と should を伴う that 節。"},{"id":"5-18","jp":"そのような結論を下すには、証拠があまりにも少ない。","tokens":["There is","far too","little evidence","on","which","to base","such a conclusion."],"ex":"前置詞＋関係代名詞＋不定詞。"},{"id":"5-19","jp":"その理論を否定するのではなく、適用範囲を明らかにすべきである。","tokens":["Rather than","rejecting","the theory,","we","should clarify","the scope","of its application."],"ex":"rather than＋動名詞、scope は範囲。"},{"id":"5-20","jp":"何が実現可能かを理解して初めて、何をすべきか決めることができる。","tokens":["Only","by understanding","what is feasible","can","we decide","what","should be done."],"ex":"Only by が文頭に置かれるため主節は倒置する。"}]}];
const $=id=>document.getElementById(id);
const all=groups.flatMap(g=>g.items.map(q=>({...q,level:g.level}))),bank=new Map(all.map(q=>[q.id,q]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const make=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e};
const button=(text,fn,cls)=>{const b=make("button",text,cls);b.type="button";b.onclick=fn;return b};
const key="study-library-english-order-v1";let storageOK=true;
function read(k,f){try{return JSON.parse(localStorage.getItem(key+k))??f}catch(e){storageOK=false;return f}}
function write(k,v){try{if(v===null)localStorage.removeItem(key+k);else localStorage.setItem(key+k,JSON.stringify(v))}catch(e){storageOK=false}}
let history=read(":history",{}),saved=read(":progress",null),session=null,level="all";
if(!history||typeof history!=="object"||Array.isArray(history))history={};
function permutation(a,n,full){return Array.isArray(a)&&(!full||a.length===n)&&a.length<=n&&new Set(a).size===a.length&&a.every(x=>Number.isInteger(x)&&x>=0&&x<n)}
function valid(s){return !!(s&&Array.isArray(s.ids)&&s.ids.length&&s.ids.every(id=>bank.has(id))&&Number.isInteger(s.index)&&s.index>=0&&s.index<s.ids.length&&Array.isArray(s.orders)&&Array.isArray(s.answers)&&s.orders.length===s.ids.length&&s.answers.length===s.ids.length&&s.ids.every((id,i)=>permutation(s.orders[i],bank.get(id).tokens.length,true)&&(s.answers[i]===null||permutation(s.answers[i],bank.get(id).tokens.length,true)))&&permutation(s.draft,bank.get(s.ids[s.index]).tokens.length,false))}
if(!valid(saved))saved=null;
const missed=()=>all.filter(q=>history[q.id]?.correct===false).map(q=>q.id);
function page(id,focus){for(const p of ["setup","quiz","result"])$(p).classList.toggle("hidden",p!==id);$(id).scrollIntoView({block:"start"});if(focus)$(focus).focus({preventScroll:true})}
function persist(){saved=session;write(":progress",saved)}
function update(){
 const known=all.filter(q=>history[q.id]);
 $("stats").textContent="収録 "+all.length+"問｜学習済み "+known.length+"問｜要復習 "+missed().length+"問。"+(storageOK?"履歴・中断データはこのブラウザに保存されます。":"ブラウザの保存機能が利用できません。");
 $("review-all").textContent="誤答を復習（"+missed().length+"問）";$("review-all").disabled=!missed().length;
 $("resume").replaceChildren();
 if(valid(saved)){$("resume").append(button("中断した演習を再開（"+saved.answers.filter(a=>a!==null).length+"/"+saved.ids.length+"問）",()=>{session=saved;page("quiz","jp");show()},"primary"))}
}
function pool(){return level==="all"?all:all.filter(q=>q.level===level)}
function setLevel(l){level=l;for(const b of $("levels").children)b.setAttribute("aria-pressed",String(b.dataset.level===l));const max=pool().length;$("count").max=max;$("count").value=Math.min(20,max);$("presets").replaceChildren();for(const n of [5,10,20,50].filter(x=>x<max).concat(max))$("presets").append(button(n===max?"全"+n+"問":n+"問",()=>{$("count").value=n}));$("error").textContent=""}
function begin(ids,label){if(!ids.length)return;if(valid(saved)&&!confirm("中断中の演習を上書きしますか？"))return;session={ids:ids.slice(),label,index:0,orders:ids.map(id=>{const n=bank.get(id).tokens.length;const a=Array.from({length:n},(_,i)=>i);const b=shuffle(a);if(b.every((x,i)=>x===i))[b[0],b[1]]=[b[1],b[0]];return b}),answers:ids.map(()=>null),draft:[]};persist();page("quiz","jp");show()}
function question(){return bank.get(session.ids[session.index])}
function isCorrect(a,q){return !!(a&&a.length===q.tokens.length&&(a.map(i=>q.tokens[i]).join(" ")===q.tokens.join(" ")||(q.alternatives||[]).includes(a.map(i=>q.tokens[i]).join(" "))))}
// Remove capitalization and sentence-ending punctuation as ordering clues.
// Keep proper nouns and the pronoun I; retain the original sentence for grading and feedback.
function displayToken(token){
 return token.replace(/\b[A-Za-z]+\b/g,word=>["I","Kyoto","English"].includes(word)?word:word.toLowerCase()).replace(/[.!?]+$/,"");
}
function renderTokens(){const q=question(),submitted=session.answers[session.index],chosen=submitted||session.draft,locked=submitted!==null;$("answer").replaceChildren();$("pool").replaceChildren();if(!chosen.length)$("answer").append(make("span","ここに英文を組み立てます","muted"));for(const id of chosen){const b=button(displayToken(q.tokens[id]),()=>{session.draft=session.draft.filter(x=>x!==id);persist();renderTokens()},"token picked");b.disabled=locked;$("answer").append(b)}for(const id of session.orders[session.index]){if(chosen.includes(id))continue;const b=button(displayToken(q.tokens[id]),()=>{session.draft.push(id);persist();renderTokens()},"token");b.disabled=locked;$("pool").append(b)}$("submit").disabled=locked||chosen.length!==q.tokens.length;$("undo").disabled=locked||!chosen.length;$("clear").disabled=locked||!chosen.length}
function show(){const q=question(),submitted=session.answers[session.index];$("jp").textContent=q.jp;$("progress").textContent=q.level+"｜"+(session.index+1)+" / "+session.ids.length+"問";$("bar").style.width=(100*(session.index+(submitted!==null?1:0))/session.ids.length)+"%";$("feedback").classList.add("hidden");$("next").classList.add("hidden");renderTokens();if(submitted!==null)feedback()}
function feedback(){const q=question(),a=session.answers[session.index],ok=isCorrect(a,q);const f=$("feedback");f.replaceChildren(make("strong",ok?"正解！":"不正解",ok?"good":"bad"));if(!ok)f.append(make("p","あなたの解答： "+a.map(i=>q.tokens[i]).join(" ")));f.append(make("p",q.tokens.join(" "),"english"),make("p",q.ex));f.classList.remove("hidden");$("next").textContent=session.index===session.ids.length-1?"採点結果を見る":"次の問題へ";$("next").classList.remove("hidden");$("bar").style.width=(100*(session.index+1)/session.ids.length)+"%"}
$("submit").onclick=()=>{const q=question();if(session.answers[session.index]!==null||session.draft.length!==q.tokens.length)return;const a=session.draft.slice(),ok=isCorrect(a,q);session.answers[session.index]=a;history[q.id]={correct:ok,attempts:(history[q.id]?.attempts||0)+1};write(":history",history);persist();renderTokens();feedback()};
$("undo").onclick=()=>{if(session.answers[session.index]===null){session.draft.pop();persist();renderTokens()}};
$("clear").onclick=()=>{if(session.answers[session.index]===null){session.draft=[];persist();renderTokens()}};
$("next").onclick=()=>{if(session.answers[session.index]===null)return;if(session.index+1<session.ids.length){session.index++;session.draft=[];persist();show();$("quiz").scrollIntoView({block:"start"});$("jp").focus({preventScroll:true})}else finish()};
function finish(){const done=session,wrong=[],stats={};let score=0;done.ids.forEach((id,i)=>{const q=bank.get(id),a=done.answers[i],ok=isCorrect(a,q);stats[q.level]??={n:0,c:0};stats[q.level].n++;if(ok){score++;stats[q.level].c++}else wrong.push({q,a})});saved=null;write(":progress",null);$("score").textContent=score+" / "+done.ids.length+"問（"+Math.round(score/done.ids.length*100)+"%）";$("breakdown").textContent=Object.entries(stats).map(([l,v])=>l+" "+v.c+"/"+v.n).join(" ｜ ");$("mistakes").replaceChildren();$("mistakes-title").textContent="誤答一覧（"+wrong.length+"問）";$("mistakes-fold").hidden=!wrong.length;for(const {q,a} of wrong){const li=make("li");li.append(make("strong",q.jp),make("p","解答： "+a.map(i=>q.tokens[i]).join(" ")),make("p","正解： "+q.tokens.join(" ")),make("p",q.ex));$("mistakes").append(li)}$("again").onclick=()=>begin(done.ids,done.label);$("retry").disabled=!wrong.length;$("retry").onclick=()=>begin(wrong.map(w=>w.q.id),"誤答再演習");page("result","score")}
$("pause").onclick=()=>{if(confirm("演習を中断しますか？ 解答途中の語句も保存されます。")){persist();update();page("setup")}};
$("home").onclick=()=>{update();page("setup")};
$("review-all").onclick=()=>begin(shuffle(missed()),"誤答復習");
$("start").onclick=()=>{const n=Number($("count").value),p=pool();if(!Number.isInteger(n)||n<1||n>p.length){$("error").textContent="1〜"+p.length+"問の整数を指定してください。";return}begin(($("order").value==="random"?shuffle(p):p).slice(0,n).map(q=>q.id),level)};
for(const [l,desc] of [["all","100問"],["基礎","文型・時制"],["基本","不定詞・受動態"],["標準","関係詞・仮定法"],["応用","語法・倒置"],["発展","難関大構文"]]){const b=button("",()=>setLevel(l));b.dataset.level=l;b.append(make("strong",l==="all"?"全レベル":l),make("small",l==="all"?desc:desc+"・20問"));$("levels").append(b)}
setLevel("all");update();$("start").disabled=false;
}catch(e){const p=document.getElementById("stats");if(p)p.textContent="演習の初期化に失敗しました。再読み込みしてください。";console.error(e)}})();
</script></body></html>
